name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency gate
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          DAEMON_VERSION="$(grep -m1 '^version' remy-cc/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          SCANNER_VERSION="$(grep -m1 '^version' remy-cc/scanner-core/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=$TAG_VERSION VERSION=$FILE_VERSION remy-cc=$DAEMON_VERSION scanner-core=$SCANNER_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ] || [ "$TAG_VERSION" != "$DAEMON_VERSION" ] || [ "$TAG_VERSION" != "$SCANNER_VERSION" ]; then
            echo "::error::version mismatch: tag=$TAG_VERSION VERSION=$FILE_VERSION remy-cc=$DAEMON_VERSION scanner-core=$SCANNER_VERSION"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --manifest-path remy-cc/Cargo.toml --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ASSET="remy-cc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          BIN_DIR="remy-cc/target/${{ matrix.target }}/release"
          tar -czf "$ASSET" -C "$BIN_DIR" remy-cc
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "remy-cc-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "remy-cc/target/${{ matrix.target }}/release/remy-cc.exe" -DestinationPath $asset
          "$((Get-FileHash $asset -Algorithm SHA256).Hash.ToLower())  $asset" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Attest build provenance (Unix)
        if: runner.os != 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: remy-cc-*.tar.gz
      - name: Attest build provenance (Windows)
        if: runner.os == 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: remy-cc-*.zip

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" remy-cc-* --clobber
