name: Test

on:
  push:
    branches: [main, runtime-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tree_sitter: false
          - python-version: "3.12"
            tree_sitter: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.tree_sitter
        run: python -m pip install -r requirements-tree-sitter.txt
      - run: python -m pytest tests -q -p no:cacheprovider
      - if: matrix.tree_sitter
        run: python tests/tee_project_canary.py tests/fixtures/tee_canary --fixture --backend tree-sitter --scope product
      - if: ${{ !matrix.tree_sitter }}
        run: python tests/tee_project_canary.py tests/fixtures/tee_canary --fixture --backend regex --scope product
      - run: pyright -p pyrightconfig.json

  windows-locks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r requirements-tree-sitter.txt
      - run: python -m pytest tests/test_index_state.py tests/test_remy_config.py tests/test_config_ui.py tests/test_rust_parser.py -q -p no:cacheprovider

  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: pyright browser_tests
      - run: python -m pytest browser_tests -q -p no:cacheprovider --browser chromium --tracing off --video off --screenshot off

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path remy-daemon/Cargo.toml --all -- --check
      - run: cargo clippy --workspace --manifest-path remy-daemon/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --workspace --manifest-path remy-daemon/Cargo.toml
      - run: cargo build --workspace --manifest-path remy-daemon/Cargo.toml
      - name: verify static musl binary (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --manifest-path remy-daemon/Cargo.toml --target x86_64-unknown-linux-musl
          binary="remy-daemon/target/x86_64-unknown-linux-musl/release/remy-daemon"
          sha256sum "$binary"
          ldd_output=$(ldd "$binary" 2>&1 || true)
          printf '%s\n' "$ldd_output"
          printf '%s\n' "$ldd_output" | grep -Eq 'not a dynamic executable|statically linked'
          if readelf -d "$binary" | grep -q '(NEEDED)'; then
            echo 'musl binary contains a dynamic NEEDED entry' >&2
            exit 1
          fi
      - name: verify static CRT in release binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --manifest-path remy-daemon/Cargo.toml
          $bytes = [System.IO.File]::ReadAllBytes("remy-daemon/target/release/remy-daemon.exe")
          if ([System.Text.Encoding]::ASCII.GetString($bytes).Contains("VCRUNTIME140")) {
            throw "release binary references VCRUNTIME140 (dynamic CRT); expected crt-static"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_daemon_integration.py tests/test_daemon_ipc.py -q -p no:cacheprovider -s
      - name: cross-implementation scanner diff
        run: |
          python -m pip install -r requirements-tree-sitter.txt
          python -m pytest tests/test_scanner_core_diff.py -q -p no:cacheprovider
