name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            tree_sitter: false
          - python-version: "3.12"
            tree_sitter: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.tree_sitter
        run: python -m pip install -r requirements-tree-sitter.txt
      - run: python -m pytest tests -q -p no:cacheprovider
      - if: matrix.tree_sitter
        run: python tests/tee_project_canary.py tests/fixtures/tee_canary --fixture --backend tree-sitter --scope product
      - if: ${{ !matrix.tree_sitter }}
        run: python tests/tee_project_canary.py tests/fixtures/tee_canary --fixture --backend regex --scope product
      - run: pyright -p pyrightconfig.json

  windows-locks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_index_state.py tests/test_remy_config.py tests/test_config_ui.py -q -p no:cacheprovider

  browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: pyright browser_tests
      - run: python -m pytest browser_tests -q -p no:cacheprovider --browser chromium --tracing off --video off --screenshot off

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path remy-daemon/Cargo.toml -- --check
      - run: cargo clippy --manifest-path remy-daemon/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path remy-daemon/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest tests/test_daemon_integration.py -q -p no:cacheprovider
