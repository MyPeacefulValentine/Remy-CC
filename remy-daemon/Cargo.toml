[workspace]
members = [".", "scanner-core"]

[package]
name = "remy-daemon"
version = "0.2.0"
edition = "2021"
description = "Remy-CC resident daemon (R1.1: single-instance skeleton)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
scanner-core = { path = "scanner-core" }

[dev-dependencies]
tempfile = "3"
