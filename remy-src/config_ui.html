}

window.toggleLang=function(){
  lang=(lang==="en")?"zh-CN":"en";
  render();
};

function loadConfig(preserveLang,preserveDraft){
  return fetch("/api/config").then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(data){
    config=data;
    if(!preserveLang)lang=config.lang==="zh-CN"?"zh-CN":"en";
    if(isProject())document.body.classList.add("theme-project");
    else document.body.classList.remove("theme-project");
    if(activeGroup===null||!visibleGroupParams({id:activeGroup}).length){
      var firstGroup=(config.groups||[]).filter(function(group){return visibleGroupParams(group).length>0})[0];
      activeGroup=firstGroup?firstGroup.id:null;
    }
    if(!preserveDraft)initializeDraft();
    render();
    return true;
  });
}

function init(){
  loadConfig(false,false).catch(function(e){
    document.getElementById("status").className="status error";
    document.getElementById("status").textContent="Failed to load: "+e.message;
    document.getElementById("status").style.display="block";
  });
}

function initializeDraft(){
  draftValues={};pendingSecrets={};pendingRemovals={};modifiedKeys={};overrides={};
  var locals=config.project_values||{};
  config.registry.forEach(function(param){
    if(isProject()&&param.key in locals)overrides[param.key]=true;
    if(param.type!=="password")draftValues[param.key]=getServerValue(param);
  });
  updateDirtyState();
}

function getServerValue(param){
  if(isProject()){
    var local=config.project_values||{};
    if(param.key in local)return local[param.key];
  }
  var values=config.values||{};
  return values[param.key]!=null?values[param.key]:param["default"];
}

function updateDirtyState(){
  var serverValues={},serverOverrides={};
  config.registry.forEach(function(param){
    if(param.type!=="password")serverValues[param.key]=getServerValue(param);
  });
  var locals=config.project_values||{};
  for(var key in locals)serverOverrides[key]=true;
  modifiedKeys=calculateModifiedKeys(
    config.registry,serverValues,draftValues,serverOverrides,overrides,pendingSecrets,pendingRemovals,isProject()
  );
  dirty=Object.keys(modifiedKeys).length>0;
  updateControlState();
}

function renderTestState(){
  var result=document.getElementById("llm-test-result");
  var button=document.getElementById("llm-test-btn");
  if(!result||!button)return;
  button.textContent=testState==="testing"?t("testingConnection"):t("testConnection");
  result.className="llm-test-result "+testState;
  result.removeAttribute("role");
  result.setAttribute("aria-live","polite");
  if(testState==="idle"){result.textContent="";return}
  if(testState==="testing"){
    result.setAttribute("role","status");
    result.innerHTML='<span class="llm-test-spinner" aria-hidden="true">◌</span>'+t("testingConnection");
    return;
  }
  if(testState==="success"){
    result.setAttribute("role","status");
    result.textContent="✓ "+t("testSuccess")+" · "+testResult.latency_ms+" "+t("testMs");
    return;
  }
  result.setAttribute("role","alert");
  var message=t("test_"+(testResult&&testResult.category||"invalid_response"));
  if(testResult&&testResult.http_status!=null)message+=" ("+t("testHttp")+" "+testResult.http_status+")";
  result.textContent="! "+message;
}

function clearTestResult(){
  if(testState==="testing")return;
  testState="idle";testResult=null;renderTestState();
}

function buildTestPayload(secretAction,secretValue,baseUrl,model){
  return {api_key_action:secretAction,api_key:secretAction==="replace"?secretValue:"",base_url:baseUrl,model:model};
}
if(typeof globalThis!=="undefined")globalThis.remyBuildTestPayload=buildTestPayload;

function resolveTestState(result){return result&&result.category==="success"?"success":"error"}
if(typeof globalThis!=="undefined")globalThis.remyResolveTestState=resolveTestState;

function releaseTestPayload(payload){
  if(payload&&Object.prototype.hasOwnProperty.call(payload,"api_key"))delete payload.api_key;
  return payload;
}
if(typeof globalThis!=="undefined")globalThis.remyReleaseTestPayload=releaseTestPayload;

function testConnection(){
  if(isProject()||testState==="testing"||isSaveBusy())return Promise.resolve(false);
  var secretAction=pendingSecrets.REMY_LLM_API_KEY||"preserve";
  var secretValue=secretAction==="replace"?(draftValues.REMY_LLM_API_KEY||""):"";
  var baseUrl=draftValues.REMY_LLM_BASE_URL||"";
  var model=draftValues.REMY_LLM_MODEL||"";
  var payload=buildTestPayload(secretAction,secretValue,baseUrl,model);
  testState="testing";testResult=null;updateControlState();renderTestState();
  return postJson("/api/test-llm",payload)
    .then(function(response){return response.json().then(function(body){return {ok:response.ok,body:body}})})
    .then(function(response){
      testResult=response.body;
      testState=response.ok?resolveTestState(testResult):"error";
      return testState==="success";
    }).catch(function(){
      testResult={category:"connection",http_status:null,latency_ms:0};testState="error";return false;
    }).finally(function(){
      releaseTestPayload(payload);payload=null;secretValue=null;updateControlState();renderTestState();
    });
}

function createTestControls(){
  var wrap=document.createElement("div");wrap.className="llm-test";
  var button=document.createElement("button");button.type="button";button.className="btn-toggle";button.id="llm-test-btn";
  button.addEventListener("click",testConnection);
  var result=document.createElement("span");result.id="llm-test-result";result.className="llm-test-result";
  wrap.appendChild(button);wrap.appendChild(result);return wrap;
}

function normalizeQuery(query){
  return String(query==null?"":query).replace(/\s+/g," ").replace(/^ | $/g,"").toLowerCase();
}
if(typeof globalThis!=="undefined")globalThis.remyNormalizeQuery=normalizeQuery;

function paramMatchesQuery(param,groupLabelEn,groupLabelZh,query){
  if(!query)return true;
  var hay=[param.key,param.label_en||"",param.label_zh||"",param.desc_en||"",param.desc_zh||"",groupLabelEn||"",groupLabelZh||""];
  for(var i=0;i<hay.length;i++){
    if(String(hay[i]).toLowerCase().indexOf(query)>=0)return true;
  }
  return false;
}
if(typeof globalThis!=="undefined")globalThis.remyParamMatchesQuery=paramMatchesQuery;

function resolveFieldState(flags){
  if(flags.unsaved)return "unsaved";
  if(flags.environment)return "environment";
  if(flags.projectOverride)return "project";
  if(flags.explicit)return flags.differsFromDefault?"deviated":"explicit_default";
  return "default";
}
if(typeof globalThis!=="undefined")globalThis.remyResolveFieldState=resolveFieldState;

function resolveRestoreAction(param,ctx){
  if(ctx.projectMode){
    return ctx.override?"restore_inherit":null;
  }
  if(param.secret)return null;
  if(ctx.pendingRemoval)return "undo_restore";
  if(ctx.explicit||ctx.unsavedEdit)return "restore_default";
  return null;
}
if(typeof globalThis!=="undefined")globalThis.remyResolveRestoreAction=resolveRestoreAction;

function fieldStateFor(param){
  if(param.type==="password"){
    if(pendingSecrets[param.key]==="replace")return "secret_replace";
    if(pendingSecrets[param.key]==="clear")return "secret_clear";
    var configured=config.secret_state&&config.secret_state[param.key]&&config.secret_state[param.key].has_value;
    return configured?"secret_configured":"default";
  }
  var proj=isProject();
  var fileValues=proj?(config.project_values||{}):(config.user_values||{});
  var explicit=param.key in fileValues;
  return resolveFieldState({
    unsaved:!!modifiedKeys[param.key],
    environment:((config.sources||{})[param.key])==="environment",
    projectOverride:proj&&explicit,
    explicit:explicit,
    differsFromDefault:explicit&&String(fileValues[param.key])!==String(param["default"])
  });
}

function groupUnsavedCount(groupId){
  var count=0;
  config.registry.forEach(function(param){
    if(param.group===groupId&&modifiedKeys[param.key])count++;
  });
  return count;
}

function isParamPinned(param){
  return !!modifiedKeys[param.key]||!!pendingRemovals[param.key];
}

function visibleGroupParams(group){
  var proj=isProject();
  return config.registry.filter(function(p){
    return p.group===group.id&&(!proj||p.project_allowed!==false)
  });
}

function renderGroupNav(){
  var list=document.getElementById("nav-list");
  list.innerHTML="";
  config.groups.forEach(function(group){
    var params=visibleGroupParams(group);
    if(!params.length)return;
    var label=lang==="zh-CN"?group.label_zh:group.label_en;
    var button=document.createElement("button");
    button.type="button";
    button.className="nav-item"+(group.id===activeGroup&&!searchQuery?" active":"");

    button.appendChild(svgIcon(GROUP_ICONS[group.id]||"i-summary"));

    button.appendChild(name);

    badge.textContent=unsaved>0?(t("groupUnsaved"))(unsaved):"";
    if(unsaved===0)badge.style.display="none";
    button.appendChild(badge);

function navigateToGroup(groupId){
  var drawerWasOpen=document.getElementById("group-nav").classList.contains("open");
  activeGroup=groupId;

    searchRaw="";searchQuery="";
    document.getElementById("search-input").value="";
  }
  renderGroupNav();
  renderGroups();
  closeDrawer();

function buildPageHead(iconId,titleText,subText,advancedChip){
  var head=document.createElement("div");
  head.className="page-head";

  icon.className="page-ic";
  icon.appendChild(svgIcon(iconId));

  }

function renderGroups(){
  var container=document.getElementById("groups");
  container.innerHTML="";
  var searching=!!searchQuery;
  var empty=document.getElementById("search-empty");
  var countEl=document.getElementById("search-count");
  if(searching){
    var matchTotal=renderSearchResults(container);
    if(matchTotal===0){
      document.getElementById("search-empty-msg").textContent=(t("noResults"))(searchRaw.trim());
      empty.className="search-empty show";
    }else{
      empty.className="search-empty";
    }
    countEl.textContent=(t("resultCount"))(matchTotal);
  }else{
    empty.className="search-empty";
    countEl.textContent="";
    renderActiveGroup(container);
  }
  updateControlState();
}

function renderSearchResults(container){
  var proj=isProject();
  var head=buildPageHead("i-search",t("searchResults"),"“"+searchRaw.trim()+"”",false);
  container.appendChild(head);
  var section=document.createElement("div");
  section.className="group search-result";
  section.dataset.group="search-results";
  var matchTotal=0;
  config.groups.forEach(function(group){
    var params=visibleGroupParams(group);
    var shown=params.filter(function(p){
      return paramMatchesQuery(p,group.label_en,group.label_zh,searchQuery)
    });
    matchTotal+=shown.length;
    shown.forEach(function(param){
      section.appendChild(createParam(param,group));
      if(!proj&&group.id==="llm_api"&&param.key==="REMY_LLM_MODEL")section.appendChild(createTestControls());
    });
  });
  if(matchTotal>0)container.appendChild(section);
  return matchTotal;
}

function renderActiveGroup(container){
  var proj=isProject();
  var group=null;
  (config.groups||[]).forEach(function(g){if(g.id===activeGroup)group=g});
  if(!group)return;
  var params=visibleGroupParams(group);
  if(!params.length)return;
  var common=params.filter(function(p){return !p.advanced});
  var advanced=params.filter(function(p){return p.advanced});
  var allAdvanced=common.length===0;
  var label=lang==="zh-CN"?group.label_zh:group.label_en;
  container.appendChild(buildPageHead(GROUP_ICONS[group.id]||"i-summary",label,(t("itemCount"))(params.length),allAdvanced));

  var section=document.createElement("div");
  section.className="group";
  section.dataset.group=group.id;

  if(allAdvanced){
    params.forEach(function(param){
      section.appendChild(createParam(param,null));
    });
  }else{
    common.forEach(function(param){
      section.appendChild(createParam(param,null));
      if(!proj&&group.id==="llm_api"&&param.key==="REMY_LLM_MODEL")section.appendChild(createTestControls());
    });
    var expandedAdvanced=!!advancedShown[group.id];
    var shownAdvanced=advanced.filter(function(p){return expandedAdvanced||isParamPinned(p)});
    var hiddenAdvanced=advanced.filter(function(p){return !expandedAdvanced&&!isParamPinned(p)});
    if(shownAdvanced.length){
      var advBody=document.createElement("div");
      advBody.className="adv-note";
      shownAdvanced.forEach(function(param){
        advBody.appendChild(createParam(param,null));
      });
      section.appendChild(advBody);
    }
    if(advanced.length){
      var advBtn=document.createElement("button");
      advBtn.type="button";
      advBtn.className="btn-toggle btn-advanced";
      advBtn.setAttribute("aria-expanded",String(expandedAdvanced));
      advBtn.textContent=expandedAdvanced?t("advancedHide"):(t("advancedShow"))(hiddenAdvanced.length);
      advBtn.addEventListener("click",function(){
        if(advancedShown[group.id])delete advancedShown[group.id];
        else advancedShown[group.id]=true;
        renderGroups();
      });
      section.appendChild(advBtn);
    }
  }
  container.appendChild(section);
  staggerParams(section);
}

function staggerParams(root){
  var items=root?root.querySelectorAll(".param"):[];
  var cap=Math.min(items.length,6);
  for(var i=0;i<items.length;i++){
    items[i].style.animationDelay=Math.min(i,cap)*26+"ms";
  }
}

function getCurrentValue(param){
  if(param.type==="password")return "";
  if(param.key in draftValues)return draftValues[param.key];
  return getServerValue(param);
}

function getGlobalValue(param){
  if(param.type==="password")return "";
  var g=config.user_values||{};
  if(param.key in g)return g[param.key];
  var values=config.values||{};
  return values[param.key]!=null?values[param.key]:param["default"];
}

function optionLabel(param,idx,optValue){
  var descs=lang==="zh-CN"?param.option_desc_zh:param.option_desc_en;
  if(descs&&descs[idx])return optValue+" — "+descs[idx];
  return optValue;
}

function applyRestoreAction(param,action){
  if(action==="restore_inherit"){
    overrides[param.key]=false;
    draftValues[param.key]=getGlobalValue(param);
  }else if(action==="undo_restore"){
    delete pendingRemovals[param.key];
    draftValues[param.key]=getServerValue(param);
  }else if(action==="restore_default"){
    var fileValues=config.user_values||{};
    if(param.key in fileValues)pendingRemovals[param.key]=true;
    if(((config.sources||{})[param.key])!=="environment")draftValues[param.key]=param["default"];
    if(param.key==="REMY_LLM_BASE_URL"||param.key==="REMY_LLM_MODEL")clearTestResult();
  }
  updateDirtyState();
  renderGroups();
}

function closeAllListboxes(except){
  var open=document.querySelectorAll(".sel.open");
  for(var i=0;i<open.length;i++){
    if(open[i]!==except)closeListbox(open[i]);
  }
}

function closeListbox(sel){
  sel.classList.remove("open");
  var btn=sel.querySelector(".sel-btn");
  if(btn)btn.setAttribute("aria-expanded","false");
}

function buildListbox(param,select,optionValues){
  var sel=document.createElement("div");
  sel.className="sel";
  sel.appendChild(select);
  var btn=document.createElement("button");
  btn.type="button";
  btn.className="sel-btn";
  btn.id="sb-p-"+param.key;
  btn.setAttribute("role","combobox");
  btn.setAttribute("aria-haspopup","listbox");
  btn.setAttribute("aria-expanded","false");
  btn.setAttribute("aria-controls","sl-p-"+param.key);
  btn.setAttribute("aria-label",(lang==="zh-CN"?param.label_zh:param.label_en)||param.key);
  var val=document.createElement("span");
  val.className="sel-val";
  val.textContent=select.value;
  btn.appendChild(val);
  btn.appendChild(svgIcon("i-chevron","ic sel-arrow"));
  btn.disabled=select.disabled;
  sel.appendChild(btn);
  var list=document.createElement("ul");
  list.className="sel-list";
  list.id="sl-p-"+param.key;
  list.setAttribute("role","listbox");
  list.setAttribute("aria-label",(lang==="zh-CN"?param.label_zh:param.label_en)||param.key);
  var items=[];
  var cursor=Math.max(0,optionValues.indexOf(select.value));
  optionValues.forEach(function(opt,idx){
    var li=document.createElement("li");
    li.setAttribute("role","option");
    li.dataset.v=opt;
    li.setAttribute("aria-selected",String(opt===select.value));
    var text=document.createElement("span");
    text.textContent=optionLabel(param,idx,opt);
    li.appendChild(text);
    li.appendChild(svgIcon("i-check","ic sel-tick"));
    li.addEventListener("click",function(){pick(idx)});
    li.addEventListener("mouseenter",function(){setCursor(idx)});
    list.appendChild(li);
    items.push(li);
  });
  sel.appendChild(list);

  function setCursor(idx){
    cursor=(idx+items.length)%items.length;
    items.forEach(function(el,n){el.classList.toggle("cursor",n===cursor)});
  }
  function openList(){
    if(btn.disabled)return;
    closeAllListboxes(sel);
    sel.classList.add("open");
    btn.setAttribute("aria-expanded","true");
    setCursor(Math.max(0,optionValues.indexOf(select.value)));
  }
  function pick(idx){
    var value=items[idx].dataset.v;
    items.forEach(function(el,n){el.setAttribute("aria-selected",String(n===idx))});
    val.textContent=value;
    if(select.value!==value){
      select.value=value;
      select.dispatchEvent(new Event("change",{bubbles:true}));
    }
    closeListbox(sel);
    btn.focus();
  }
  btn.addEventListener("click",function(){
    if(sel.classList.contains("open"))closeListbox(sel);
    else openList();
  });
  btn.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="Enter"||e.key===" "){
      e.preventDefault();
      if(!sel.classList.contains("open")){openList();return}
      if(e.key==="ArrowDown")setCursor(cursor+1);
      else if(e.key==="ArrowUp")setCursor(cursor-1);
      else pick(cursor);
    }else if(e.key==="Home"&&sel.classList.contains("open")){e.preventDefault();setCursor(0)}
    else if(e.key==="End"&&sel.classList.contains("open")){e.preventDefault();setCursor(items.length-1)}
    else if(e.key==="Escape"&&sel.classList.contains("open")){e.stopPropagation();closeListbox(sel);btn.focus()}
  });
  return sel;
}

function createParam(param,searchGroup){
  var proj=isProject();
  var isOverride=proj&&overrides[param.key];
  var currentValue=getCurrentValue(param);
  var globalValue=proj?getGlobalValue(param):null;
  var state=fieldStateFor(param);
  var narrow=param.type==="int"||param.type==="float"||param.type==="enum"||param.type==="bool";

  var div=document.createElement("div");
  div.className="param"+(narrow?" narrow":"");
  div.dataset.key=param.key;

  var textCol=document.createElement("div");
  textCol.className="param-text";
  var top=document.createElement("div");
  top.className="param-top";
  var lbl=document.createElement("label");
  lbl.className="param-label";
  lbl.htmlFor="p-"+param.key;
  lbl.textContent=(lang==="zh-CN"?param.label_zh:param.label_en)||param.key;
  top.appendChild(lbl);
  var stateTag=document.createElement("span");
  stateTag.className="state-tag state-"+state;
  stateTag.textContent=t("state_"+state);
  top.appendChild(stateTag);
  if(searchGroup){
    var gTag=document.createElement("span");
    gTag.className="group-tag";
    gTag.textContent=lang==="zh-CN"?searchGroup.label_zh:searchGroup.label_en;
    top.appendChild(gTag);
  }

  var toggleEl=null;
  if(proj){
    toggleEl=document.createElement("button");
    toggleEl.type="button";
    toggleEl.className="toggle"+(isOverride?" active":"");
    toggleEl.setAttribute("role","switch");
    toggleEl.setAttribute("aria-checked",String(!!isOverride));
    toggleEl.setAttribute("aria-label",lbl.textContent+" · "+(isOverride?t("custom"):t("inherit")));
    toggleEl.title=isOverride?t("custom"):t("inherit");
    top.appendChild(toggleEl);
    var tLbl=document.createElement("span");
    tLbl.className="toggle-label";
    tLbl.textContent=isOverride?t("custom"):t("inherit");
    top.appendChild(tLbl);
  }

  var restoreAction=resolveRestoreAction(param,{
    projectMode:proj,
    override:!!isOverride,
    pendingRemoval:!!pendingRemovals[param.key],
    explicit:param.key in ((proj?config.project_values:config.user_values)||{}),
    unsavedEdit:!!modifiedKeys[param.key]
  });
  if(restoreAction){
    var restoreBtn=document.createElement("button");
    restoreBtn.type="button";
    restoreBtn.className="btn-restore";

function syncSelButtons(){
  var sels=document.querySelectorAll("#groups .sel");
  for(var i=0;i<sels.length;i++){
    var native=sels[i].querySelector("select");
    var btn=sels[i].querySelector(".sel-btn");
    if(!native||!btn)continue;
    btn.disabled=native.disabled;
    var val=btn.querySelector(".sel-val");
    if(val&&val.textContent!==native.value)val.textContent=native.value;
  }
}

function buildPayload(registry,states,modified,projectOverrides,removals,projectMode){
  var data={},clearSecrets=[],removeKeys=[];
  registry.forEach(function(param){
    if(!projectMode&&removals&&removals[param.key]){removeKeys.push(param.key);return}
    var state=states[param.key];
    if(!state||!modified[param.key])return;
    if(projectMode&&!projectOverrides[param.key])return;
    if(param.type==="password"){
      if(state.clear)clearSecrets.push(param.key);
      else if(state.modified&&state.value)data[param.key]=state.value;
    }else data[param.key]=state.value;
  });
  var payload={values:data,clear_secrets:clearSecrets};
  if(!projectMode&&removeKeys.length)payload.remove_keys=removeKeys;
  return payload;
}
if(typeof globalThis!=="undefined")globalThis.remyBuildPayload=buildPayload;

function calculateModifiedKeys(registry,serverValues,drafts,serverOverrides,draftOverrides,secrets,removals,projectMode){
  var result={};
  registry.forEach(function(param){
    if(param.type==="password"){
      if(secrets[param.key])result[param.key]=true;
      return;
    }
    if(!projectMode&&removals&&removals[param.key])result[param.key]=true;
    if(String(drafts[param.key])!==String(serverValues[param.key]))result[param.key]=true;
    if(projectMode&&!!draftOverrides[param.key]!==!!serverOverrides[param.key])result[param.key]=true;
  });
  return result;
}
if(typeof globalThis!=="undefined")globalThis.remyCalculateModifiedKeys=calculateModifiedKeys;

function collectFormData(){
  var states={};
  config.registry.forEach(function(param){
    var el=document.getElementById("p-"+param.key);
    if(el&&param.type!=="password")draftValues[param.key]=el.value;
    states[param.key]={
      value:param.type==="password"?(draftValues[param.key]||""):(param.key in draftValues?draftValues[param.key]:getServerValue(param)),
      clear:pendingSecrets[param.key]==="clear",
      modified:pendingSecrets[param.key]==="replace"
    };
  });
  updateDirtyState();
  return buildPayload(config.registry,states,modifiedKeys,overrides,pendingRemovals,isProject());
}

function effectiveValidationValues(data){
  var values={};
  var current=config.values||{};
  for(var key in current)values[key]=current[key];
  for(var update in data)values[update]=data[update];
  return values;
}

function validate(data){
  var keysToCheck=isProject()?overrides:null;
  for(var i=0;i<config.registry.length;i++){
    var param=config.registry[i];
    if(param.type!=="int")continue;
    if(keysToCheck&&!keysToCheck[param.key])continue;
    if(!(param.key in data))continue;
    var val=data[param.key];
    var num=parseInt(val,10);
    if(isNaN(num))return param.key+t("validationInt");
    if(param.min!=null&&num<param.min)return param.key+t("validationMin")+param.min;
    if(param.max!=null&&num>param.max)return param.key+t("validationMax")+param.max;
  }
  return null;
}

function validateConstraints(data){
  var eCap=parseInt(data["REMY_ENRICHMENT_CAP"]||"15",10);
  var eCapLarge=parseInt(data["REMY_ENRICHMENT_CAP_LARGE"]||"10",10);
  var eTierFull=parseInt(data["REMY_ENRICHMENT_TIER_FULL_MAX"]||"200",10);
  var eTierMid=parseInt(data["REMY_ENRICHMENT_TIER_MID_MAX"]||"1000",10);
  var errors=[];
  if(eCap<eCapLarge){
    errors.push({key:"REMY_ENRICHMENT_CAP",msg:"must be ≥ REMY_ENRICHMENT_CAP_LARGE ("+eCapLarge+")"});
    errors.push({key:"REMY_ENRICHMENT_CAP_LARGE",msg:"must be ≤ REMY_ENRICHMENT_CAP ("+eCap+")"});
  }
  if(eTierFull>eTierMid){
    errors.push({key:"REMY_ENRICHMENT_TIER_FULL_MAX",msg:"must be ≤ REMY_ENRICHMENT_TIER_MID_MAX ("+eTierMid+")"});
    errors.push({key:"REMY_ENRICHMENT_TIER_MID_MAX",msg:"must be ≥ REMY_ENRICHMENT_TIER_FULL_MAX ("+eTierFull+")"});
  }
  return errors.length?errors:null;
}

function clearToasts(){
  var old=document.querySelectorAll(".toast-constraint");
  for(var i=0;i<old.length;i++)old[i].parentNode.removeChild(old[i]);
}

function showToast(key,msg){
  var input=document.getElementById("p-"+key);
  if(!input)return;
  var anchor=input.classList.contains("sel-native")?input.parentNode:input;
  var rect=anchor.getBoundingClientRect();
  var el=document.createElement("span");
  el.className="toast-constraint";
  el.textContent=msg;
  el.style.top=(rect.bottom+6)+"px";
  el.style.left=Math.max(8,Math.min(rect.left,window.innerWidth-260))+"px";
  document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},3000);
}

function isSaveBusy(){
  return saveState==="validating"||saveState==="saving"||saveState==="refreshing"||saveState==="refresh_error";
}

function resolveSaveOutcome(postSucceeded,refreshSucceeded){
  if(!postSucceeded)return {state:"error",canClose:false};
  if(!refreshSucceeded)return {state:"refresh_error",canClose:false};
  return {state:"idle",canClose:true};
}
if(typeof globalThis!=="undefined")globalThis.remyResolveSaveOutcome=resolveSaveOutcome;

function applySaveOutcome(postSucceeded,refreshSucceeded){
  var outcome=resolveSaveOutcome(postSucceeded,refreshSucceeded);
  setSaveState(outcome.state);
  return outcome.canClose;
}
if(typeof globalThis!=="undefined")globalThis.remyApplySaveOutcome=applySaveOutcome;

function updateControlState(){
  if(!config)return;
  var busy=isSaveBusy()||testState==="testing";
  var saveBtn=document.getElementById("save-btn");
  saveBtn.disabled=!!config.read_only||busy||!dirty;
  saveBtn.classList.toggle("is-busy",busy);
  document.getElementById("reset-btn").disabled=!!config.read_only||busy;
  document.getElementById("clear-all-btn").disabled=!!config.read_only||busy;
  document.getElementById("lang-btn").disabled=busy;
  document.getElementById("exit-btn").disabled=busy;
  document.getElementById("search-input").disabled=busy;
  document.getElementById("drawer-btn").disabled=busy;
  document.getElementById("retry-refresh-btn").style.display=saveState==="refresh_error"?"inline-flex":"none";
  var dirtyCount=Object.keys(modifiedKeys).length;
  document.getElementById("dirty-count").textContent=dirtyCount>0?(t("unsavedCount"))(dirtyCount):"";
  var navButtons=document.querySelectorAll("#nav-list .nav-item");
  for(var n=0;n<navButtons.length;n++)navButtons[n].disabled=busy;
  var controls=document.querySelectorAll("#groups input,#groups select,#groups button,#groups .toggle");
  for(var i=0;i<controls.length;i++){
    if(busy)controls[i].setAttribute("data-save-disabled","true");
    if(busy)controls[i].disabled=true;
    else if(controls[i].getAttribute("data-save-disabled")==="true"){
      controls[i].removeAttribute("data-save-disabled");
      if(controls[i].classList.contains("toggle"))controls[i].disabled=false;
      else if(!isProject()||overrides[(controls[i].id||"").slice(2)]||controls[i].tagName==="BUTTON")controls[i].disabled=false;
    }
  }
  syncSelButtons();
  updateFieldDecorations();
  renderTestState();
}

function setSaveState(next){
  saveState=next;
  updateControlState();
}

function save(resetMode){
  resetMode=typeof resetMode==="string"?resetMode:"none";
  if(config.read_only){showStatus("error",t("diagnostics"));return Promise.resolve(false)}
  if(saveState!=="idle"&&saveState!=="error"&&saveState!=="success")return Promise.resolve(false);
  if(resetMode==="none"&&!dirty)return Promise.resolve(false);
  setSaveState("validating");
  var form={values:{},clear_secrets:[]};
  if(resetMode==="none")form=collectFormData();
  var data=form.values;
  var validationValues=effectiveValidationValues(data);
  clearToasts();
  var err=resetMode==="none"?validate(data):null;
  if(err){setSaveState("error");showStatus("error",err);return Promise.resolve(false)}
  var constraintErrors=resetMode==="none"?validateConstraints(validationValues):null;
  if(constraintErrors){
    setSaveState("error");
    for(var i=0;i<constraintErrors.length;i++)showToast(constraintErrors[i].key,constraintErrors[i].msg);
    return Promise.resolve(false);
  }

  var payload={values:data,clear_secrets:form.clear_secrets,reset_mode:resetMode};
  if(resetMode==="none"&&form.remove_keys)payload.remove_keys=form.remove_keys;
  if(isProject()&&resetMode==="none"){
    payload.overrides=[];
    for(var k in overrides){if(overrides[k])payload.overrides.push(k)}
  }
  setSaveState("saving");
  return postJson("/api/save",payload)
    .then(function(r){return r.json().then(function(body){return {ok:r.ok,body:body}})})
    .then(function(response){
      if(!response.ok||response.body.status!=="ok")throw new Error(response.body.message||("HTTP "+response.body.status));
      var restartPending=response.body.restart_pending||[];
      setSaveState("refreshing");
      return loadConfig(true,false).then(function(){
        applySaveOutcome(true,true);
        if(resetMode==="none"&&restartPending.length>0)showStatus("success",t("restartPending")(restartPending.join(", ")));
        else showStatus("success",resetMode==="none"?t("saved"):(resetMode==="non_secret"?t("resetDone"):t("clearDone")));
        return true;
      }).catch(function(e){
        applySaveOutcome(true,false);showStatus("error",t("refreshFailed")+" "+e.message);return false;
      });
    }).catch(function(e){applySaveOutcome(false,false);showStatus("error",t("error")+e.message);return false});
}

// 磁性拉近：按钮在自身区域内向指针方向轻移，位移限于 1.5px，离开后弹性回位。
(function(){
  var mags=document.querySelectorAll(".mag");
  if(!mags.length||!window.matchMedia||!window.matchMedia("(hover:hover)").matches||window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var maxPull=1.5,factor=0.08;
  var attach=function(btn){
    var raf=null,px=0,py=0,moving=false;
    function apply(){
      raf=null;
      if(!moving)return;
      btn.style.setProperty("--mx",px.toFixed(2)+"px");
      btn.style.setProperty("--my",py.toFixed(2)+"px");
    }
    btn.addEventListener("pointermove",function(e){
      var r=btn.getBoundingClientRect();
      var dx=e.clientX-(r.left+r.width/2);
      var dy=e.clientY-(r.top+r.height/2);
      px=Math.max(-maxPull,Math.min(maxPull,dx*factor));
      py=Math.max(-maxPull,Math.min(maxPull,dy*factor));
      moving=true;
      if(raf===null)raf=requestAnimationFrame(apply);
    });
    btn.addEventListener("pointerleave",function(){
      moving=false;
      if(raf!==null){cancelAnimationFrame(raf);raf=null}
      btn.style.setProperty("--mx","0px");
      btn.style.setProperty("--my","0px");
    });
  };
  for(var i=0;i<mags.length;i++)attach(mags[i]);
})();
document.getElementById("reset-btn").addEventListener("click",confirmReset);
document.getElementById("clear-all-btn").addEventListener("click",confirmClearAll);
document.getElementById("retry-refresh-btn").addEventListener("click",retryRefresh);
document.getElementById("exit-btn").addEventListener("click",exitUI);
document.getElementById("drawer-btn").addEventListener("click",function(){
  var nav=document.getElementById("group-nav");
  if(nav.classList.contains("open"))closeDrawer();
  else openDrawer();
});
document.getElementById("search-input").addEventListener("input",function(e){applySearch(e.target.value)});
document.getElementById("search-input").addEventListener("keydown",function(e){
  if(e.key==="Escape"&&searchRaw){e.preventDefault();clearSearch()}
});
document.getElementById("search-clear-btn").addEventListener("click",clearSearch);
document.getElementById("modal-ov").addEventListener("click",function(e){
  if(e.target===this)hideModal();
});
document.addEventListener("click",function(e){
  var open=document.querySelectorAll(".sel.open");
  for(var i=0;i<open.length;i++){
    if(!open[i].contains(e.target))closeListbox(open[i]);
  }
  var nav=document.getElementById("group-nav");
  if(nav.classList.contains("open")&&!nav.contains(e.target)&&e.target.id!=="drawer-btn"&&!document.getElementById("drawer-btn").contains(e.target)){
    closeDrawer();
  }
});
document.addEventListener("keydown",function(e){
  var ov=document.getElementById("modal-ov");
  if(ov.classList.contains("show")){
    if(e.key==="Escape"&&ov.dataset.locked!=="true"){e.preventDefault();hideModal();return}
    if(e.key==="Tab"){
      var focusable=Array.prototype.slice.call(document.getElementById("modal-box").querySelectorAll("button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex='-1'])"));
      if(focusable.length){
        var first=focusable[0],last=focusable[focusable.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
      }
      return;
    }
  }
  if(e.key!=="Escape"||e.defaultPrevented)return;
  var openSel=document.querySelector(".sel.open");
  if(openSel){closeListbox(openSel);return}
  closeDrawer();
});
document.getElementById("groups").addEventListener("input",function(e){
  var id=e.target&&e.target.id||"";
  if(id.indexOf("p-")===0&&e.target.type!=="password"){
    draftValues[id.slice(2)]=e.target.value;
    delete pendingRemovals[id.slice(2)];
  }
  if(id==="p-REMY_LLM_BASE_URL"||id==="p-REMY_LLM_MODEL")clearTestResult();
  updateDirtyState();
});
document.getElementById("groups").addEventListener("change",function(e){
  var id=e.target&&e.target.id||"";
  if(id.indexOf("p-")===0&&e.target.type!=="password"){
    draftValues[id.slice(2)]=e.target.value;
    delete pendingRemovals[id.slice(2)];
  }
  if(id==="p-REMY_LLM_BASE_URL"||id==="p-REMY_LLM_MODEL")clearTestResult();
  updateDirtyState();
});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();save("none")}
});
window.addEventListener("beforeunload",function(e){
  if(dirty){e.preventDefault();e.returnValue=""}
});
var heartbeatFailures=0;
var HEARTBEAT_FAILURE_LIMIT=3;
var serviceEnded=false;
function showServiceEnded(){
  if(serviceEnded)return;
  serviceEnded=true;
  var wasDirty=dirty;
  dirty=false;
  var ov=document.getElementById("modal-ov");
  var box=document.getElementById("modal-box");
  document.getElementById("modal-title").textContent="";
  document.getElementById("modal-msg").textContent="";
  document.getElementById("modal-btns").innerHTML="";
  box.querySelector("h2").textContent=wasDirty?t("serviceEndedDirty"):t("serviceEnded");
  box.querySelector("p").textContent="";
  ov.classList.add("show");
  ov.onclick=null;
}
function sendHeartbeat(){
  fetch("/api/heartbeat").then(function(r){
    if(r.ok){heartbeatFailures=0;return}
    heartbeatFailures+=1;
    if(heartbeatFailures>=HEARTBEAT_FAILURE_LIMIT)showServiceEnded();
  }).catch(function(){
    heartbeatFailures+=1;
    if(heartbeatFailures>=HEARTBEAT_FAILURE_LIMIT)showServiceEnded();
  });
}
setInterval(sendHeartbeat,2000);
init();
})();
</script>
</body>
</html>
