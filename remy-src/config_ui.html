<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remy Configuration</title>
<style>
:root{--c-pri:#6366f1;--c-pri-h:#4f46e5;--c-pri-a:#4338ca;--c-pri-ring:rgba(99,102,241,.1);--c-pri-shadow:rgba(99,102,241,.3);--c-bg:#f4f5f7;--c-srf:#fff;--c-bdr:#e5e7eb;--c-bdr-h:#d1d5db;--c-txt:#1a1a2e;--c-txt2:#374151;--c-txt3:#6b7280;--c-txt4:#9ca3af;--c-ok-bg:#ecfdf5;--c-ok-txt:#065f46;--c-ok-bdr:#a7f3d0;--c-err-bg:#fef2f2;--c-err-txt:#991b1b;--c-err-bdr:#fca5a5;--c-warn-bg:#fffbeb;--c-warn-txt:#92400e;--c-warn-bdr:#fde68a}
body.theme-project{--c-pri:#059669;--c-pri-h:#047857;--c-pri-a:#065f46;--c-pri-ring:rgba(5,150,105,.1);--c-pri-shadow:rgba(5,150,105,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--c-bg);color:var(--c-txt);line-height:1.6}
#app{max-width:1120px;margin:0 auto;padding:24px 20px 40px}
#remy-host header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start}
.header-left{flex:1}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--c-txt3);word-break:break-all}
.header-actions{display:flex;gap:6px;margin-top:2px}
.btn-lang,.btn-mode-tag,.btn-exit{padding:6px 14px;border:1px solid var(--c-bdr-h);border-radius:6px;background:var(--c-srf);cursor:pointer;font-size:13px;color:var(--c-txt2);white-space:nowrap;transition:all .15s}
.btn-lang:hover,.btn-exit:hover{background:#f3f4f6;transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btn-lang:active,.btn-exit:active{transform:translateY(0);box-shadow:none}
.btn-exit{color:#dc2626;border-color:#fca5a5}
.btn-exit:hover{background:#fef2f2}
.btn-mode-tag{cursor:default;font-weight:600;color:var(--c-pri);border-color:var(--c-pri)}
.config-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search-wrap{flex:1;min-width:220px;display:flex;align-items:center;gap:8px}
#search-input{flex:1;padding:8px 10px;border:1px solid var(--c-bdr-h);border-radius:6px;font-size:14px;font-family:inherit;background:var(--c-srf)}
#search-input:focus{border-color:var(--c-pri);outline:none;box-shadow:0 0 0 3px var(--c-pri-ring)}
#search-count{font-size:12px;color:var(--c-txt3);white-space:nowrap}
.config-body{display:flex;gap:20px;align-items:flex-start}
.group-nav{width:240px;flex-shrink:0;position:sticky;top:16px;background:var(--c-srf);border:1px solid var(--c-bdr);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}
.group-nav button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 10px;border:none;border-radius:6px;background:transparent;cursor:pointer;font-size:13px;color:var(--c-txt2);font-family:inherit;text-align:left}
.group-nav button:hover{background:#f3f4f6}
.group-nav button .nav-count{font-size:11px;color:var(--c-txt4)}
#group-select{display:none;width:100%;padding:8px 10px;border:1px solid var(--c-bdr-h);border-radius:6px;font-size:14px;font-family:inherit;background:var(--c-srf);margin-bottom:12px}
.config-main{flex:1;min-width:0}
.group{background:var(--c-srf);border-radius:10px;margin-bottom:14px;border:1px solid var(--c-bdr);overflow:hidden}
.group-header{width:100%;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;user-select:none;transition:background .15s;border:none;background:transparent;font-family:inherit;color:var(--c-txt);text-align:left}
.group-header:hover{background:#f9fafb}
.group-header .arrow{font-size:12px;color:var(--c-txt4);transition:transform .2s}
.group-header .arrow.collapsed{transform:rotate(-90deg)}
.group-header .badge{font-size:11px;font-weight:400;color:var(--c-txt3);margin-left:8px}
.group-header .group-unsaved{font-size:11px;font-weight:600;color:var(--c-warn-txt);background:var(--c-warn-bg);border:1px solid var(--c-warn-bdr);border-radius:4px;padding:0 6px;margin-left:8px}
.group-header .gicon{margin-right:8px;font-size:16px}
.group-body{padding:4px 18px 18px;display:block}
.group-body.hidden{display:none}
.param{margin-bottom:16px;position:relative}
.param:last-child{margin-bottom:0}
.param-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.param-label{font-size:13.5px;font-weight:600;color:var(--c-txt)}
.param-key{font-family:"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:11.5px;color:var(--c-txt4);background:#f3f4f6;padding:1px 5px;border-radius:3px;margin-bottom:4px;display:inline-block}
.param-desc{font-size:12px;color:var(--c-txt3);margin-bottom:4px}
.param-meta{font-size:11px;color:var(--c-txt4);margin-top:4px}
.state-tag{font-size:10.5px;border:1px solid var(--c-bdr);border-radius:4px;padding:0 6px;color:var(--c-txt3);white-space:nowrap}
.state-tag.state-unsaved,.state-tag.state-secret_replace,.state-tag.state-secret_clear{color:var(--c-warn-txt);background:var(--c-warn-bg);border-color:var(--c-warn-bdr)}
.state-tag.state-environment{color:var(--c-err-txt);background:var(--c-err-bg);border-color:var(--c-err-bdr)}
.state-tag.state-project{color:var(--c-pri);border-color:var(--c-pri)}
.state-tag.state-deviated,.state-tag.state-explicit_default,.state-tag.state-secret_configured{color:var(--c-ok-txt);background:var(--c-ok-bg);border-color:var(--c-ok-bdr)}
.btn-restore{margin-left:auto;padding:2px 10px;border:1px solid var(--c-bdr-h);border-radius:6px;background:var(--c-srf);cursor:pointer;font-size:11.5px;white-space:nowrap;color:var(--c-txt2);font-family:inherit}
.btn-restore:hover{background:#f3f4f6}
.param input,.param select{width:100%;padding:8px 10px;border:1px solid var(--c-bdr-h);border-radius:6px;font-size:14px;font-family:inherit;background:var(--c-srf);transition:border-color .15s,box-shadow .15s}
.param input:focus,.param select:focus{border-color:var(--c-pri);outline:none;box-shadow:0 0 0 3px var(--c-pri-ring)}
.param input:disabled,.param select:disabled{background:#f3f4f6;color:var(--c-txt4);cursor:not-allowed}
.param input[type=number]{appearance:textfield}
.param input[type=number]::-webkit-inner-spin-button{opacity:1}
.input-row{display:flex;align-items:center;gap:8px}
.input-row input,.input-row select{flex:1}
.input-unit{font-size:12px;color:var(--c-txt3);white-space:nowrap}
.pw-wrap{display:flex;gap:6px;flex:1}
.pw-wrap input{flex:1}
.btn-toggle{padding:8px 12px;border:1px solid var(--c-bdr-h);border-radius:6px;background:var(--c-srf);cursor:pointer;font-size:12px;white-space:nowrap;color:var(--c-txt2);transition:all .15s;font-family:inherit}
.btn-toggle:hover{background:#f3f4f6;transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btn-toggle:active{transform:translateY(0);box-shadow:none}
.btn-advanced{margin-top:4px}
.toggle{position:relative;width:36px;height:20px;background:var(--c-bdr-h);border-radius:10px;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.active{background:var(--c-pri)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.active::after{transform:translateX(16px)}
.toggle-label{font-size:11px;color:var(--c-txt4);white-space:nowrap}
.actionbar{position:sticky;bottom:0;background:var(--c-srf);border:1px solid var(--c-bdr);border-radius:10px;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 -2px 8px rgba(0,0,0,.04);z-index:50;margin-top:16px}
#dirty-count{font-size:12px;color:var(--c-txt3);margin-right:auto}
.btn{padding:9px 22px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;border:1px solid var(--c-bdr-h);background:var(--c-srf);color:var(--c-txt2);transition:all .15s;font-family:inherit}
.btn:hover{background:#f3f4f6;transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled,.btn-lang:disabled,.btn-toggle:disabled,.btn-exit:disabled,.btn-restore:disabled,.group-header:disabled,.group-nav button:disabled{opacity:.45;cursor:not-allowed;pointer-events:none;transform:none;box-shadow:none}
.btn:disabled:hover,.btn-lang:disabled:hover,.btn-toggle:disabled:hover{transform:none;box-shadow:none}
.btn-p{background:var(--c-pri);color:#fff;border-color:var(--c-pri);box-shadow:0 2px 8px var(--c-pri-shadow)}
.btn-p:hover{background:var(--c-pri-h);transform:translateY(-1px);box-shadow:0 4px 12px var(--c-pri-shadow)}
.btn-p:active{background:var(--c-pri-a);transform:translateY(0);box-shadow:none}
.btn-w{color:#dc2626;border-color:#fca5a5}
.btn-w:hover{background:#fef2f2;transform:translateY(-1px);box-shadow:0 2px 6px rgba(220,38,38,.1)}
.search-empty{background:var(--c-srf);border:1px solid var(--c-bdr);border-radius:10px;padding:24px;text-align:center;font-size:13px;color:var(--c-txt3);display:none}
.search-empty.show{display:block}
.search-empty .btn{margin-top:12px}
.status{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:13px;display:none;animation:fadeIn .2s}
.status.success{display:block;background:var(--c-ok-bg);color:var(--c-ok-txt);border:1px solid var(--c-ok-bdr)}
.status.error{display:block;background:var(--c-err-bg);color:var(--c-err-txt);border:1px solid var(--c-err-bdr)}
.unknown-warn,.diagnostic-warn,.acl-warn{margin-top:12px;padding:10px 14px;background:var(--c-warn-bg);border:1px solid var(--c-warn-bdr);border-radius:8px;font-size:12px;color:var(--c-warn-txt)}
.source-note{font-size:11px;color:var(--c-warn-txt);margin-top:4px}
.llm-test{margin:4px 0 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.llm-test-result{font-size:12px;min-height:20px;transition:opacity .18s}
.llm-test-result.testing{color:var(--c-txt3)}
.llm-test-result.success{color:var(--c-ok-txt)}
.llm-test-result.error{color:var(--c-err-txt)}
.llm-test-spinner{display:inline-block;margin-right:5px;animation:llmSpin .8s linear infinite}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-ov.show{opacity:1;pointer-events:auto}
.modal{background:var(--c-srf);border-radius:12px;padding:24px;width:360px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15);transform:scale(.95);transition:transform .2s}
.modal-ov.show .modal{transform:scale(1)}
.modal h2{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--c-txt)}
.modal p{font-size:13px;color:var(--c-txt3);margin-bottom:16px;line-height:1.5}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns .btn{padding:7px 16px;font-size:12px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
.toast-constraint{position:fixed;background:var(--c-err-bg);color:var(--c-err-txt);border:1px solid var(--c-err-bdr);padding:4px 10px;border-radius:6px;font-size:11px;white-space:nowrap;z-index:200;animation:fadeIn .2s;pointer-events:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes llmSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.llm-test-result{transition:none}.llm-test-spinner{animation:none}}
@media(max-width:900px){.group-nav{display:none}#group-select{display:block}}
@media(max-width:600px){#app{padding:16px 12px 40px}.actionbar{flex-wrap:wrap;justify-content:center}#remy-host header{flex-direction:column;gap:8px}}
</style>
</head>
<body>
<div id="app">
  <div id="remy-host">
    <header>
      <div class="header-left">
        <img id="logo" src="/logo.svg" alt="Remy" width="32" height="32" style="vertical-align:middle;margin-right:8px"><h1 id="title" style="display:inline;vertical-align:middle">Remy Configuration</h1>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="header-actions">
        <span class="btn-mode-tag" id="mode-tag"></span>
        <button class="btn-lang" id="lang-btn">中文</button>
        <button class="btn-exit" id="exit-btn" title="">Exit</button>
      </div>
    </header>
  </div>
  <div id="config-page">
    <div class="config-toolbar">
      <div class="search-wrap">
        <label for="search-input" id="search-label" style="font-size:13px;color:var(--c-txt2)">Search</label>
        <input type="search" id="search-input" autocomplete="off">
        <span id="search-count" aria-live="polite"></span>
      </div>
      <button class="btn-toggle" id="expand-all-btn"></button>
      <button class="btn-toggle" id="collapse-all-btn"></button>
    </div>
    <select id="group-select" aria-label="Groups"></select>
    <div class="config-body">
      <nav class="group-nav" id="group-nav" aria-label="Configuration groups"></nav>
      <div class="config-main">
        <div id="groups"></div>
        <div class="search-empty" id="search-empty">
          <div id="search-empty-msg"></div>
          <button class="btn" id="search-clear-btn"></button>
        </div>
        <div id="unknown-area"></div>
        <div class="status" id="status"></div>
        <div class="actionbar" id="actionbar">
          <span id="dirty-count"></span>
          <button class="btn btn-p" id="save-btn" title="">Save</button>
          <button class="btn" id="reset-btn" title="">Reset</button>
          <button class="btn btn-w" id="clear-all-btn" title="">Clear All</button>
          <button class="btn" id="retry-refresh-btn" style="display:none">Reload</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-ov" id="modal-ov">
  <div class="modal" id="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-msg"></p>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

function t(key){return(TEXT[lang]||TEXT.en)[key]||(TEXT.en)[key]||key}
function isProject(){return config&&config.mode==="project"}
function postJson(path,payload){
  return fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Remy-Session":sessionToken},body:JSON.stringify(payload)})
}

window.toggleLang=function(){
  lang=(lang==="en")?"zh-CN":"en";
  render();
};

function loadConfig(preserveLang,preserveDraft){
  return fetch("/api/config").then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(data){
    config=data;
    if(!preserveLang)lang=config.lang==="zh-CN"?"zh-CN":"en";
    if(isProject())document.body.classList.add("theme-project");
    else document.body.classList.remove("theme-project");
    if(collapsedGroups===null){
      collapsedGroups={};
      (config.groups||[]).forEach(function(group,index){
        if(index>0)collapsedGroups[group.id]=true;
      });
    }
    if(!preserveDraft)initializeDraft();
    render();
    return true;
  });
}

function init(){
  loadConfig(false,false).catch(function(e){
    document.getElementById("status").className="status error";
    document.getElementById("status").textContent="Failed to load: "+e.message;
    document.getElementById("status").style.display="block";
  });
}

function initializeDraft(){
  draftValues={};pendingSecrets={};pendingRemovals={};modifiedKeys={};overrides={};
  var locals=config.project_values||{};
  config.registry.forEach(function(param){
    if(isProject()&&param.key in locals)overrides[param.key]=true;
    if(param.type!=="password")draftValues[param.key]=getServerValue(param);
  });
  updateDirtyState();
}

function getServerValue(param){
  if(isProject()){
    var local=config.project_values||{};
    if(param.key in local)return local[param.key];
  }
  var values=config.values||{};
  return values[param.key]!=null?values[param.key]:param["default"];
}

function updateDirtyState(){
  var serverValues={},serverOverrides={};
  config.registry.forEach(function(param){
    if(param.type!=="password")serverValues[param.key]=getServerValue(param);
  });
  var locals=config.project_values||{};
  for(var key in locals)serverOverrides[key]=true;
  modifiedKeys=calculateModifiedKeys(
    config.registry,serverValues,draftValues,serverOverrides,overrides,pendingSecrets,pendingRemovals,isProject()
  );
  dirty=Object.keys(modifiedKeys).length>0;
  updateControlState();
}

function renderTestState(){
  var result=document.getElementById("llm-test-result");
  var button=document.getElementById("llm-test-btn");
  if(!result||!button)return;
  button.textContent=testState==="testing"?t("testingConnection"):t("testConnection");
  result.className="llm-test-result "+testState;
  result.removeAttribute("role");
  result.setAttribute("aria-live","polite");
  if(testState==="idle"){result.textContent="";return}
  if(testState==="testing"){
    result.setAttribute("role","status");
    result.innerHTML='<span class="llm-test-spinner" aria-hidden="true">◌</span>'+t("testingConnection");
    return;
  }
  if(testState==="success"){
    result.setAttribute("role","status");
    result.textContent="✓ "+t("testSuccess")+" · "+testResult.latency_ms+" "+t("testMs");
    return;
  }
  result.setAttribute("role","alert");
  var message=t("test_"+(testResult&&testResult.category||"invalid_response"));
  if(testResult&&testResult.http_status!=null)message+=" ("+t("testHttp")+" "+testResult.http_status+")";
  result.textContent="! "+message;
}

function clearTestResult(){
  if(testState==="testing")return;
  testState="idle";testResult=null;renderTestState();
}

function buildTestPayload(secretAction,secretValue,baseUrl,model){
  return {api_key_action:secretAction,api_key:secretAction==="replace"?secretValue:"",base_url:baseUrl,model:model};
}
if(typeof globalThis!=="undefined")globalThis.remyBuildTestPayload=buildTestPayload;

function resolveTestState(result){return result&&result.category==="success"?"success":"error"}
if(typeof globalThis!=="undefined")globalThis.remyResolveTestState=resolveTestState;

function releaseTestPayload(payload){
  if(payload&&Object.prototype.hasOwnProperty.call(payload,"api_key"))delete payload.api_key;
  return payload;
}
if(typeof globalThis!=="undefined")globalThis.remyReleaseTestPayload=releaseTestPayload;

function testConnection(){
  if(isProject()||testState==="testing"||isSaveBusy())return Promise.resolve(false);
  var secretAction=pendingSecrets.REMY_LLM_API_KEY||"preserve";
  var secretValue=secretAction==="replace"?(draftValues.REMY_LLM_API_KEY||""):"";
  var baseUrl=draftValues.REMY_LLM_BASE_URL||"";
  var model=draftValues.REMY_LLM_MODEL||"";
  var payload=buildTestPayload(secretAction,secretValue,baseUrl,model);
  testState="testing";testResult=null;updateControlState();renderTestState();
  return postJson("/api/test-llm",payload)
    .then(function(response){return response.json().then(function(body){return {ok:response.ok,body:body}})})
    .then(function(response){
      testResult=response.body;
      testState=response.ok?resolveTestState(testResult):"error";
      return testState==="success";
    }).catch(function(){
      testResult={category:"connection",http_status:null,latency_ms:0};testState="error";return false;
    }).finally(function(){
      releaseTestPayload(payload);payload=null;secretValue=null;updateControlState();renderTestState();
    });
}

function createTestControls(){
  var wrap=document.createElement("div");wrap.className="llm-test";
  var button=document.createElement("button");button.type="button";button.className="btn-toggle";button.id="llm-test-btn";
  button.addEventListener("click",testConnection);
  var result=document.createElement("span");result.id="llm-test-result";result.className="llm-test-result";
  wrap.appendChild(button);wrap.appendChild(result);return wrap;
}

function normalizeQuery(query){
  return String(query==null?"":query).replace(/\s+/g," ").replace(/^ | $/g,"").toLowerCase();
}
if(typeof globalThis!=="undefined")globalThis.remyNormalizeQuery=normalizeQuery;

function paramMatchesQuery(param,groupLabelEn,groupLabelZh,query){
  if(!query)return true;
  var hay=[param.key,param.label_en||"",param.label_zh||"",param.desc_en||"",param.desc_zh||"",groupLabelEn||"",groupLabelZh||""];
  for(var i=0;i<hay.length;i++){
    if(String(hay[i]).toLowerCase().indexOf(query)>=0)return true;
  }
  return false;
}
if(typeof globalThis!=="undefined")globalThis.remyParamMatchesQuery=paramMatchesQuery;

function resolveFieldState(flags){
  if(flags.unsaved)return "unsaved";
  if(flags.environment)return "environment";
  if(flags.projectOverride)return "project";
  if(flags.explicit)return flags.differsFromDefault?"deviated":"explicit_default";
  return "default";
}
if(typeof globalThis!=="undefined")globalThis.remyResolveFieldState=resolveFieldState;

function resolveRestoreAction(param,ctx){
  if(ctx.projectMode){
    return ctx.override?"restore_inherit":null;
  }
  if(param.secret)return null;
  if(ctx.pendingRemoval)return "undo_restore";
  if(ctx.explicit||ctx.unsavedEdit)return "restore_default";
  return null;
}
if(typeof globalThis!=="undefined")globalThis.remyResolveRestoreAction=resolveRestoreAction;

function fieldStateFor(param){
  if(param.type==="password"){
    if(pendingSecrets[param.key]==="replace")return "secret_replace";
    if(pendingSecrets[param.key]==="clear")return "secret_clear";
    var configured=config.secret_state&&config.secret_state[param.key]&&config.secret_state[param.key].has_value;
    return configured?"secret_configured":"default";
  }
  var proj=isProject();
  var fileValues=proj?(config.project_values||{}):(config.user_values||{});
  var explicit=param.key in fileValues;
  return resolveFieldState({
    unsaved:!!modifiedKeys[param.key],
    environment:((config.sources||{})[param.key])==="environment",
    projectOverride:proj&&explicit,
    explicit:explicit,
    differsFromDefault:explicit&&String(fileValues[param.key])!==String(param["default"])
  });
}

function groupUnsavedCount(groupId){
  var count=0;
  config.registry.forEach(function(param){
    if(param.group===groupId&&modifiedKeys[param.key])count++;
  });
  return count;
}

function isParamPinned(param){
  return !!modifiedKeys[param.key]||!!pendingRemovals[param.key];
}

  var proj=isProject();
  document.title=proj?t("titleProject"):t("title");

  document.getElementById("clear-all-btn").textContent=t("clearAll");
  document.getElementById("retry-refresh-btn").textContent=t("retryRefresh");
  document.getElementById("exit-btn").textContent=t("exit");
  document.getElementById("lang-btn").textContent=t("langBtn");
  document.getElementById("mode-tag").textContent=proj?t("modeProject"):t("modeGlobal");
  document.getElementById("save-btn").title=t("tipSave");
  document.getElementById("reset-btn").title=t("tipReset");
  document.getElementById("exit-btn").title=t("tipExit");
  document.getElementById("search-label").textContent=t("searchLabel");
  document.getElementById("search-input").placeholder=t("searchPlaceholder");
  document.getElementById("search-input").value=searchRaw;
  document.getElementById("expand-all-btn").textContent=t("expandAll");
  document.getElementById("collapse-all-btn").textContent=t("collapseAll");
  document.getElementById("search-clear-btn").textContent=t("clearSearch");
  document.getElementById("group-select").setAttribute("aria-label",t("groupNav"));
  document.getElementById("group-nav").setAttribute("aria-label",t("groupNav"));

  if(proj){
    document.getElementById("subtitle").textContent=config.target||"";
  }else{
    document.getElementById("subtitle").textContent=t("subtitle");
  }

  document.getElementById("clear-all-btn").style.display=proj?"none":"inline-block";

  renderGroupNav();

  var unknownArea=document.getElementById("unknown-area");
  unknownArea.innerHTML="";
  if(!proj&&config.unknown_keys&&config.unknown_keys.length>0){
    var warn=document.createElement("div");
    warn.className="unknown-warn";
    var fn=t("unknownWarn");
    warn.textContent=typeof fn==="function"?fn(config.unknown_keys.length,config.unknown_keys.join(", ")):fn;
    unknownArea.appendChild(warn);
  }
  if(config.diagnostics&&config.diagnostics.length){
    var diag=document.createElement("div");
    diag.className="diagnostic-warn";
    diag.textContent=t("diagnostics")+" "+config.diagnostics.join("; ");
    unknownArea.appendChild(diag);
  }
  if(config.windows_acl_warning){
    var acl=document.createElement("div");
    acl.className="acl-warn";
    acl.textContent=t("aclWarning");

function visibleGroupParams(group){
  var proj=isProject();
  return config.registry.filter(function(p){
    return p.group===group.id&&(!proj||p.project_allowed!==false)
  });
}

function renderGroupNav(){
  var nav=document.getElementById("group-nav");
  var select=document.getElementById("group-select");
  nav.innerHTML="";
  select.innerHTML="";
  config.groups.forEach(function(group){
    var params=visibleGroupParams(group);
    if(!params.length)return;
    var label=lang==="zh-CN"?group.label_zh:group.label_en;
    var button=document.createElement("button");
    button.type="button";
    button.dataset.group=group.id;
    var name=document.createElement("span");
    name.textContent=(ICONS[group.id]||"📋")+" "+label;
    var count=document.createElement("span");
    count.className="nav-count";
    count.textContent=String(params.length);
    button.appendChild(name);
    button.appendChild(count);
    button.addEventListener("click",function(){navigateToGroup(group.id)});
    nav.appendChild(button);
    var option=document.createElement("option");
    option.value=group.id;
    option.textContent=label+" ("+params.length+")";
    select.appendChild(option);
  });
}

function navigateToGroup(groupId){
  delete collapsedGroups[groupId];
  renderGroups();
  var header=document.querySelector('.group-header[data-group="'+groupId+'"]');
  if(header)header.scrollIntoView({block:"start"});
}

function renderGroups(){
  var proj=isProject();
  var container=document.getElementById("groups");
  container.innerHTML="";
  var searching=!!searchQuery;
  var matchTotal=0;

  config.groups.forEach(function(group){
    var params=visibleGroupParams(group);
    if(!params.length)return;
    var shown=params;
    if(searching){
      shown=params.filter(function(p){
        return paramMatchesQuery(p,group.label_en,group.label_zh,searchQuery)
      });
      if(!shown.length)return;
      matchTotal+=shown.length;
    }
    var collapsed=!searching&&!!collapsedGroups[group.id];
    if(collapsed){
      var pinned=params.filter(isParamPinned);
      if(!pinned.length){
        container.appendChild(buildGroupSection(group,params,[],true,searching));
        return;
      }
      shown=pinned;
    }else if(!searching){
      var expandedAdvanced=!!advancedShown[group.id];
      shown=params.filter(function(p){
        return !p.advanced||expandedAdvanced||isParamPinned(p)
      });
    }
    container.appendChild(buildGroupSection(group,params,shown,collapsed,searching));
  });

  var empty=document.getElementById("search-empty");
  if(searching&&matchTotal===0){
    document.getElementById("search-empty-msg").textContent=(t("noResults"))(searchRaw.trim());
    empty.className="search-empty show";
  }else{
    empty.className="search-empty";
  }
  var countEl=document.getElementById("search-count");
  countEl.textContent=searching?(t("resultCount"))(matchTotal):"";
  updateControlState();
}

function buildGroupSection(group,params,shown,collapsed,searching){
  var proj=isProject();
  var section=document.createElement("div");
  section.className="group";
  section.dataset.group=group.id;
  var header=document.createElement("button");
  header.type="button";
  header.className="group-header";
  header.dataset.group=group.id;
  header.disabled=searching;
  var bodyId="group-body-"+group.id;
  header.setAttribute("aria-expanded",String(!collapsed||searching));
  header.setAttribute("aria-controls",bodyId);
  var label=lang==="zh-CN"?group.label_zh:group.label_en;
  var icon=ICONS[group.id]||"📋";
  var left=document.createElement("span");
  var iconEl=document.createElement("span");
  iconEl.className="gicon";
  iconEl.textContent=icon;
  left.appendChild(iconEl);
  left.appendChild(document.createTextNode(label));
  var badge=document.createElement("span");
  badge.className="badge";
  badge.textContent=String(params.length);
  left.appendChild(badge);
  var unsavedCount=groupUnsavedCount(group.id);
  if(unsavedCount>0){
    var unsavedBadge=document.createElement("span");
    unsavedBadge.className="group-unsaved";
    unsavedBadge.textContent=(t("groupUnsaved"))(unsavedCount);
    left.appendChild(unsavedBadge);
  }
  var arrow=document.createElement("span");
  arrow.className="arrow"+(collapsed&&!searching?" collapsed":"");
  arrow.textContent="▾";
  header.appendChild(left);
  header.appendChild(arrow);
  header.addEventListener("click",function(){
    if(searchQuery)return;
    if(collapsedGroups[group.id])delete collapsedGroups[group.id];
    else collapsedGroups[group.id]=true;
    renderGroups();
  });
  var body=document.createElement("div");
  body.className="group-body"+(collapsed&&!shown.length?" hidden":"");
  body.id=bodyId;
  shown.forEach(function(param){
    body.appendChild(createParam(param));
    if(!proj&&group.id==="llm_api"&&param.key==="REMY_LLM_MODEL")body.appendChild(createTestControls());
  });
  if(!searching&&!collapsed){
    var hiddenAdvanced=params.filter(function(p){return p.advanced&&!isParamPinned(p)});
    if(hiddenAdvanced.length||advancedShown[group.id]){
      var advBtn=document.createElement("button");
      advBtn.type="button";
      advBtn.className="btn-toggle btn-advanced";
      advBtn.setAttribute("aria-expanded",String(!!advancedShown[group.id]));
      advBtn.textContent=advancedShown[group.id]?t("advancedHide"):(t("advancedShow"))(hiddenAdvanced.length);
      advBtn.addEventListener("click",function(){
        if(advancedShown[group.id])delete advancedShown[group.id];
        else advancedShown[group.id]=true;
        renderGroups();
      });
      body.appendChild(advBtn);
    }
  }
  section.appendChild(header);
  section.appendChild(body);
  return section;
}

function getCurrentValue(param){
  if(param.type==="password")return "";
  if(param.key in draftValues)return draftValues[param.key];
  return getServerValue(param);
}

function getGlobalValue(param){
  if(param.type==="password")return "";
  var g=config.user_values||{};
  if(param.key in g)return g[param.key];
  var values=config.values||{};
  return values[param.key]!=null?values[param.key]:param["default"];
}

function optionLabel(param,idx,optValue){
  var descs=lang==="zh-CN"?param.option_desc_zh:param.option_desc_en;
  if(descs&&descs[idx])return optValue+" — "+descs[idx];
  return optValue;
}

function applyRestoreAction(param,action){
  if(action==="restore_inherit"){
    overrides[param.key]=false;
    draftValues[param.key]=getGlobalValue(param);
  }else if(action==="undo_restore"){
    delete pendingRemovals[param.key];
    draftValues[param.key]=getServerValue(param);
  }else if(action==="restore_default"){
    var fileValues=config.user_values||{};
    if(param.key in fileValues)pendingRemovals[param.key]=true;
    if(((config.sources||{})[param.key])!=="environment")draftValues[param.key]=param["default"];
    if(param.key==="REMY_LLM_BASE_URL"||param.key==="REMY_LLM_MODEL")clearTestResult();
  }
  updateDirtyState();
  renderGroups();
}

function createParam(param){
  var div=document.createElement("div");
  div.className="param";
  div.dataset.key=param.key;
  var proj=isProject();
  var isOverride=proj&&overrides[param.key];
  var currentValue=getCurrentValue(param);
  var globalValue=proj?getGlobalValue(param):null;
  var state=fieldStateFor(param);

  var top=document.createElement("div");
  top.className="param-top";
  var lbl=document.createElement("label");
  lbl.className="param-label";
  lbl.htmlFor="p-"+param.key;
  lbl.textContent=(lang==="zh-CN"?param.label_zh:param.label_en)||param.key;
  top.appendChild(lbl);
  var stateTag=document.createElement("span");
  stateTag.className="state-tag state-"+state;
  stateTag.textContent=t("state_"+state);
  top.appendChild(stateTag);

  var toggleEl=null;
  if(proj){
    toggleEl=document.createElement("div");
    toggleEl.className="toggle"+(isOverride?" active":"");
    toggleEl.title=isOverride?t("custom"):t("inherit");
    top.appendChild(toggleEl);
    var tLbl=document.createElement("span");
    tLbl.className="toggle-label";
    tLbl.textContent=isOverride?t("custom"):t("inherit");
    top.appendChild(tLbl);
  }

  var restoreAction=resolveRestoreAction(param,{
    projectMode:proj,
    override:!!isOverride,
    pendingRemoval:!!pendingRemovals[param.key],
    explicit:param.key in ((proj?config.project_values:config.user_values)||{}),
    unsavedEdit:!!modifiedKeys[param.key]
  });
  if(restoreAction){
    var restoreBtn=document.createElement("button");
    restoreBtn.type="button";
    restoreBtn.className="btn-restore";
    restoreBtn.textContent=t(restoreAction==="restore_inherit"?"restoreInherit":restoreAction==="undo_restore"?"undoRestore":"restoreDefault");
    restoreBtn.addEventListener("click",function(){
      if(isSaveBusy())return;
      applyRestoreAction(param,restoreAction);
    });
    top.appendChild(restoreBtn);
  }

  var desc=document.createElement("div");
  desc.className="param-desc";
  desc.textContent=lang==="zh-CN"?param.desc_zh:param.desc_en;
  if((config.sources||{})[param.key]==="environment"){
    var sourceNote=document.createElement("div");
    sourceNote.className="source-note";
    sourceNote.textContent=t("environmentNote");
    desc.appendChild(document.createElement("br"));
    desc.appendChild(sourceNote);
  }

  var keyLine=document.createElement("div");
  var keyCode=document.createElement("span");
  keyCode.className="param-key";
  keyCode.textContent=param.key;
  keyLine.appendChild(keyCode);

  var displayValue=isOverride?currentValue:(proj?globalValue:currentValue);
  var disabled=proj&&!isOverride;
  var input;
  var inputRow=document.createElement("div");
  inputRow.className="input-row";

  if(param.type==="enum"){
    input=document.createElement("select");
    input.id="p-"+param.key;
    input.disabled=disabled;
    (param.options||[]).forEach(function(opt,idx){
      var o=document.createElement("option");
      o.value=opt;
      o.textContent=optionLabel(param,idx,opt);
      if(opt===displayValue)o.selected=true;
      input.appendChild(o);
    });
    inputRow.appendChild(input);
  }else if(param.type==="password"){
    input=document.createElement("input");
    input.type="password";input.id="p-"+param.key;
    input.value=pendingSecrets[param.key]==="replace"?(draftValues[param.key]||""):"";input.autocomplete="off";
    input.placeholder=(config.secret_state&&config.secret_state[param.key]&&config.secret_state[param.key].has_value)?"••••••••":"";
    input.disabled=disabled;
    input.dataset.modified="false";
    if(pendingSecrets[param.key]==="replace")input.dataset.modified="true";
    if(pendingSecrets[param.key]==="clear")input.dataset.clear="true";
    input.addEventListener("input",function(){
      delete input.dataset.clear;
      if(input.value){input.dataset.modified="true";pendingSecrets[param.key]="replace";draftValues[param.key]=input.value}
      else{input.dataset.modified="false";delete pendingSecrets[param.key];delete draftValues[param.key]}
      clearTestResult();updateDirtyState();
    });
    var clearBtn=document.createElement("button");
    clearBtn.type="button";clearBtn.className="btn-toggle";clearBtn.textContent=lang==="zh-CN"?"清除":"Clear";
    clearBtn.addEventListener("click",function(){
      var hasValue=config.secret_state&&config.secret_state[param.key]&&config.secret_state[param.key].has_value;
      if(!hasValue){
        input.value="";input.dataset.modified="false";delete input.dataset.clear;
        delete pendingSecrets[param.key];delete draftValues[param.key];clearTestResult();updateDirtyState();return
      }
      showModal(t("modalSecretTitle"),t("modalSecretMsg"),[
        {text:t("modalResetCancel"),cls:"btn",action:hideModal},
        {text:t("modalSecretConfirm"),cls:"btn btn-w",action:function(){
          hideModal();input.value="";input.dataset.modified="false";input.dataset.clear="true";
          pendingSecrets[param.key]="clear";clearTestResult();updateDirtyState();
        }}
      ]);
    });
    var wrap=document.createElement("div");
    wrap.className="pw-wrap";
    wrap.appendChild(input);
    wrap.appendChild(clearBtn);
    inputRow.appendChild(wrap);
  }else if(param.type==="int"){
    input=document.createElement("input");
    input.type="number";input.id="p-"+param.key;
    input.value=displayValue;input.disabled=disabled;
    if(param.min!=null)input.min=param.min;
    if(param.max!=null)input.max=param.max;
    inputRow.appendChild(input);
  }else{
    input=document.createElement("input");
    input.type=param.type==="url"?"url":"text";
    input.id="p-"+param.key;
    input.value=displayValue;input.disabled=disabled;
    inputRow.appendChild(input);
  }
  var unitText=lang==="zh-CN"?param.unit_zh:param.unit_en;
  if(unitText){
    var unitEl=document.createElement("span");
    unitEl.className="input-unit";
    unitEl.textContent=unitText;
    inputRow.appendChild(unitEl);
  }

  var meta=document.createElement("div");
  meta.className="param-meta";
  var metaParts=[];
  if(param.type!=="password")metaParts.push(t("metaDefault")+": "+(param["default"]===""?"—":param["default"]));
  if(param.min!=null||param.max!=null)metaParts.push(t("metaRange")+": "+(param.min!=null?param.min:"")+"–"+(param.max!=null?param.max:""));
  metaParts.push(t("metaEffect")+": "+t("scope_"+(param.restart_scope||"immediate")));
  meta.textContent=metaParts.join(" · ");

  div.appendChild(top);
  div.appendChild(desc);
  div.appendChild(keyLine);
  div.appendChild(inputRow);
  div.appendChild(meta);

  if(proj&&toggleEl){
    (function(paramKey,inputEl,tEl,tLabel){
      tEl.addEventListener("click",function(){
        if(isSaveBusy())return;
        var active=tEl.classList.toggle("active");
        overrides[paramKey]=active;
        inputEl.disabled=!active;
        tLabel.textContent=active?t("custom"):t("inherit");
        tEl.title=tLabel.textContent;
        if(!active){
          inputEl.value=getGlobalValue({key:paramKey,"default":""});
          draftValues[paramKey]=inputEl.value;
        }
        updateDirtyState();
      });
    })(param.key,input,toggleEl,top.querySelector(".toggle-label"));
  }

  return div;
}

function buildPayload(registry,states,modified,projectOverrides,removals,projectMode){
  var data={},clearSecrets=[],removeKeys=[];
  registry.forEach(function(param){
    if(!projectMode&&removals&&removals[param.key]){removeKeys.push(param.key);return}
    var state=states[param.key];
    if(!state||!modified[param.key])return;
    if(projectMode&&!projectOverrides[param.key])return;
    if(param.type==="password"){
      if(state.clear)clearSecrets.push(param.key);
      else if(state.modified&&state.value)data[param.key]=state.value;
    }else data[param.key]=state.value;
  });
  var payload={values:data,clear_secrets:clearSecrets};
  if(!projectMode&&removeKeys.length)payload.remove_keys=removeKeys;
  return payload;
}
if(typeof globalThis!=="undefined")globalThis.remyBuildPayload=buildPayload;

function calculateModifiedKeys(registry,serverValues,drafts,serverOverrides,draftOverrides,secrets,removals,projectMode){
  var result={};
  registry.forEach(function(param){
    if(param.type==="password"){
      if(secrets[param.key])result[param.key]=true;
      return;
    }
    if(!projectMode&&removals&&removals[param.key])result[param.key]=true;
    if(String(drafts[param.key])!==String(serverValues[param.key]))result[param.key]=true;
    if(projectMode&&!!draftOverrides[param.key]!==!!serverOverrides[param.key])result[param.key]=true;
  });
  return result;
}
if(typeof globalThis!=="undefined")globalThis.remyCalculateModifiedKeys=calculateModifiedKeys;

function collectFormData(){
  var states={};
  config.registry.forEach(function(param){
    var el=document.getElementById("p-"+param.key);
    if(el&&param.type!=="password")draftValues[param.key]=el.value;
    states[param.key]={
      value:param.type==="password"?(draftValues[param.key]||""):(param.key in draftValues?draftValues[param.key]:getServerValue(param)),
      clear:pendingSecrets[param.key]==="clear",
      modified:pendingSecrets[param.key]==="replace"
    };
  });
  updateDirtyState();
  return buildPayload(config.registry,states,modifiedKeys,overrides,pendingRemovals,isProject());
}

function effectiveValidationValues(data){
  var values={};
  var current=config.values||{};
  for(var key in current)values[key]=current[key];
  for(var update in data)values[update]=data[update];
  return values;
}

function validate(data){
  var keysToCheck=isProject()?overrides:null;
  for(var i=0;i<config.registry.length;i++){
    var param=config.registry[i];
    if(param.type!=="int")continue;
    if(keysToCheck&&!keysToCheck[param.key])continue;
    if(!(param.key in data))continue;
    var val=data[param.key];
    var num=parseInt(val,10);
    if(isNaN(num))return param.key+t("validationInt");
    if(param.min!=null&&num<param.min)return param.key+t("validationMin")+param.min;
    if(param.max!=null&&num>param.max)return param.key+t("validationMax")+param.max;
  }
  return null;
}

function validateConstraints(data){
  var eCap=parseInt(data["REMY_ENRICHMENT_CAP"]||"15",10);
  var eCapLarge=parseInt(data["REMY_ENRICHMENT_CAP_LARGE"]||"10",10);
  var eTierFull=parseInt(data["REMY_ENRICHMENT_TIER_FULL_MAX"]||"200",10);
  var eTierMid=parseInt(data["REMY_ENRICHMENT_TIER_MID_MAX"]||"1000",10);
  var errors=[];
  if(eCap<eCapLarge){
    errors.push({key:"REMY_ENRICHMENT_CAP",msg:"must be ≥ REMY_ENRICHMENT_CAP_LARGE ("+eCapLarge+")"});
    errors.push({key:"REMY_ENRICHMENT_CAP_LARGE",msg:"must be ≤ REMY_ENRICHMENT_CAP ("+eCap+")"});
  }
  if(eTierFull>eTierMid){
    errors.push({key:"REMY_ENRICHMENT_TIER_FULL_MAX",msg:"must be ≤ REMY_ENRICHMENT_TIER_MID_MAX ("+eTierMid+")"});
    errors.push({key:"REMY_ENRICHMENT_TIER_MID_MAX",msg:"must be ≥ REMY_ENRICHMENT_TIER_FULL_MAX ("+eTierFull+")"});
  }
  return errors.length?errors:null;
}

function clearToasts(){
  var old=document.querySelectorAll(".toast-constraint");
  for(var i=0;i<old.length;i++)old[i].parentNode.removeChild(old[i]);
}

function showToast(key,msg){
  var input=document.getElementById("p-"+key);
  if(!input)return;
  var rect=input.getBoundingClientRect();
  var el=document.createElement("span");
  el.className="toast-constraint";
  el.textContent=msg;
  el.style.top=(rect.top+rect.height/2)+"px";
  el.style.left=(rect.right+8)+"px";
  el.style.transform="translateY(-50%)";
  document.body.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},3000);
}

function isSaveBusy(){
  return saveState==="validating"||saveState==="saving"||saveState==="refreshing"||saveState==="refresh_error";
}

function resolveSaveOutcome(postSucceeded,refreshSucceeded){
  if(!postSucceeded)return {state:"error",canClose:false};
  if(!refreshSucceeded)return {state:"refresh_error",canClose:false};
  return {state:"idle",canClose:true};
}
if(typeof globalThis!=="undefined")globalThis.remyResolveSaveOutcome=resolveSaveOutcome;

function applySaveOutcome(postSucceeded,refreshSucceeded){
  var outcome=resolveSaveOutcome(postSucceeded,refreshSucceeded);
  setSaveState(outcome.state);
  return outcome.canClose;
}
if(typeof globalThis!=="undefined")globalThis.remyApplySaveOutcome=applySaveOutcome;

function updateFieldDecorations(){
  var registryByKey={};
  config.registry.forEach(function(p){registryByKey[p.key]=p});
  var params=document.querySelectorAll("#groups .param");
  for(var i=0;i<params.length;i++){
    var param=registryByKey[params[i].dataset.key];
    var tag=params[i].querySelector(".state-tag");
    if(!param||!tag)continue;
    var state=fieldStateFor(param);
    tag.className="state-tag state-"+state;
    tag.textContent=t("state_"+state);
  }
  var sections=document.querySelectorAll("#groups .group");
  for(var s=0;s<sections.length;s++){
    var count=groupUnsavedCount(sections[s].dataset.group);
    var badge=sections[s].querySelector(".group-unsaved");
    var headerLeft=sections[s].querySelector(".group-header > span");
    if(count>0&&headerLeft){
      if(!badge){
        badge=document.createElement("span");
        badge.className="group-unsaved";
        headerLeft.appendChild(badge);
      }
      badge.textContent=(t("groupUnsaved"))(count);
    }else if(badge&&badge.parentNode){
      badge.parentNode.removeChild(badge);
    }
  }
}

function updateControlState(){
  if(!config)return;
  var busy=isSaveBusy()||testState==="testing";
  document.getElementById("save-btn").disabled=!!config.read_only||busy||!dirty;
  document.getElementById("reset-btn").disabled=!!config.read_only||busy;
  document.getElementById("clear-all-btn").disabled=!!config.read_only||busy;
  document.getElementById("lang-btn").disabled=busy;
  document.getElementById("exit-btn").disabled=busy;
  document.getElementById("search-input").disabled=busy;
  document.getElementById("expand-all-btn").disabled=busy||!!searchQuery;
  document.getElementById("collapse-all-btn").disabled=busy||!!searchQuery;
  document.getElementById("group-select").disabled=busy;
  document.getElementById("retry-refresh-btn").style.display=saveState==="refresh_error"?"inline-block":"none";
  var dirtyCount=Object.keys(modifiedKeys).length;
  document.getElementById("dirty-count").textContent=dirtyCount>0?(t("unsavedCount"))(dirtyCount):"";
  var navButtons=document.querySelectorAll("#group-nav button");
  for(var n=0;n<navButtons.length;n++)navButtons[n].disabled=busy;
  var controls=document.querySelectorAll("#groups input,#groups select,#groups button,#groups .toggle");
  for(var i=0;i<controls.length;i++){
    if(busy)controls[i].setAttribute("data-save-disabled","true");
    if(busy)controls[i].disabled=true;
    else if(controls[i].getAttribute("data-save-disabled")==="true"){
      controls[i].removeAttribute("data-save-disabled");
      if(controls[i].classList.contains("toggle"))controls[i].disabled=false;
      else if(!isProject()||overrides[(controls[i].id||"").slice(2)]||controls[i].tagName==="BUTTON")controls[i].disabled=false;
    }
  }
  updateFieldDecorations();
  renderTestState();
}

function setSaveState(next){
  saveState=next;
  updateControlState();
}

function save(resetMode){
  resetMode=typeof resetMode==="string"?resetMode:"none";
  if(config.read_only){showStatus("error",t("diagnostics"));return Promise.resolve(false)}
  if(saveState!=="idle"&&saveState!=="error"&&saveState!=="success")return Promise.resolve(false);
  if(resetMode==="none"&&!dirty)return Promise.resolve(false);
  setSaveState("validating");
  var form={values:{},clear_secrets:[]};
  if(resetMode==="none")form=collectFormData();
  var data=form.values;
  var validationValues=effectiveValidationValues(data);
  clearToasts();
  var err=resetMode==="none"?validate(data):null;
  if(err){setSaveState("error");showStatus("error",err);return Promise.resolve(false)}
  var constraintErrors=resetMode==="none"?validateConstraints(validationValues):null;
  if(constraintErrors){
    setSaveState("error");
    for(var i=0;i<constraintErrors.length;i++)showToast(constraintErrors[i].key,constraintErrors[i].msg);
    return Promise.resolve(false);
  }

  var payload={values:data,clear_secrets:form.clear_secrets,reset_mode:resetMode};
  if(resetMode==="none"&&form.remove_keys)payload.remove_keys=form.remove_keys;
  if(isProject()&&resetMode==="none"){
    payload.overrides=[];
    for(var k in overrides){if(overrides[k])payload.overrides.push(k)}
  }
  setSaveState("saving");
  return postJson("/api/save",payload)
    .then(function(r){return r.json().then(function(body){return {ok:r.ok,body:body}})})
    .then(function(response){
      if(!response.ok||response.body.status!=="ok")throw new Error(response.body.message||("HTTP "+response.body.status));
      var restartPending=response.body.restart_pending||[];
      setSaveState("refreshing");
      return loadConfig(true,false).then(function(){
        applySaveOutcome(true,true);
        if(resetMode==="none"&&restartPending.length>0)showStatus("success",t("restartPending")(restartPending.join(", ")));
        else showStatus("success",resetMode==="none"?t("saved"):(resetMode==="non_secret"?t("resetDone"):t("clearDone")));
        return true;
      }).catch(function(e){
        applySaveOutcome(true,false);showStatus("error",t("refreshFailed")+" "+e.message);return false;
      });
    }).catch(function(e){applySaveOutcome(false,false);showStatus("error",t("error")+e.message);return false});
}

function confirmReset(){
  var title=isProject()?t("modalClearTitle"):t("modalResetTitle");
  var message=isProject()?t("modalClearMsg"):t("modalResetMsg");
  var confirm=isProject()?t("modalClearConfirm"):t("modalResetConfirm");
  showModal(title,message,[
    {text:t("modalResetCancel"),cls:"btn",action:hideModal},
    {text:confirm,cls:"btn btn-w",action:function(){hideModal();save(isProject()?"all":"non_secret")}}
  ]);
}

function confirmClearAll(){
  showModal(t("modalClearTitle"),t("modalClearMsg"),[
    {text:t("modalResetCancel"),cls:"btn",action:hideModal},
    {text:t("modalClearConfirm"),cls:"btn btn-w",action:function(){hideModal();save("all")}}
  ]);
}

function retryRefresh(){
  if(saveState!=="refresh_error")return;
  setSaveState("refreshing");
  loadConfig(true,false).then(function(){
    setSaveState("idle");showStatus("success",t("saved"));
  }).catch(function(e){setSaveState("refresh_error");showStatus("error",t("refreshFailed")+" "+e.message)});
}

function exitUI(){
  if(dirty){
    showModal(t("modalExitTitle"),t("modalExitMsg"),[
      {text:t("modalExitCancel"),cls:"btn",action:hideModal},
      {text:t("modalExitDiscard"),cls:"btn btn-w",action:function(){hideModal();doShutdown()}},
      {text:t("modalExitSave"),cls:"btn btn-p",action:function(){hideModal();save("none").then(function(ok){if(ok)doShutdown()})}}
    ]);
  }else{
    doShutdown();
  }
}

function doShutdown(){
  serviceEnded=true;
  postJson("/api/shutdown",{}).catch(function(){});
  dirty=false;
  var ov=document.getElementById("modal-ov");
  var box=document.getElementById("modal-box");
  document.getElementById("modal-title").textContent="";
  document.getElementById("modal-msg").textContent="";
  document.getElementById("modal-btns").innerHTML="";
  box.querySelector("h2").textContent=t("closed");
  box.querySelector("p").textContent="";
  var btns=document.getElementById("modal-btns");
  var okBtn=document.createElement("button");
  okBtn.className="btn";
  okBtn.textContent="OK";
  okBtn.addEventListener("click",function(){window.close()});
  btns.appendChild(okBtn);
  ov.classList.add("show");
  ov.onclick=null;
}

function showModal(title,msg,buttons){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-msg").textContent=msg;
  var btnsEl=document.getElementById("modal-btns");
  btnsEl.innerHTML="";
  buttons.forEach(function(b){
    var btn=document.createElement("button");
    btn.className=b.cls;
    btn.textContent=b.text;
    btn.addEventListener("click",b.action);
    btnsEl.appendChild(btn);
  });
  document.getElementById("modal-ov").classList.add("show");
}

function hideModal(){
  document.getElementById("modal-ov").classList.remove("show");
}

function showStatus(type,msg){
  var el=document.getElementById("status");
  el.className="status "+type;
  el.textContent=msg;
  el.style.display="block";
  clearTimeout(el._timer);
  el._timer=setTimeout(function(){el.style.display="none"},6000);
}

function applySearch(rawValue){
  searchRaw=String(rawValue==null?"":rawValue);
  searchQuery=normalizeQuery(searchRaw);
  renderGroups();
}

function clearSearch(){
  applySearch("");
  var input=document.getElementById("search-input");
  input.value="";
  input.focus();
}

document.getElementById("logo").addEventListener("error",function(){this.style.display="none"});
document.getElementById("lang-btn").addEventListener("click",toggleLang);
document.getElementById("save-btn").addEventListener("click",function(){save("none")});
document.getElementById("reset-btn").addEventListener("click",confirmReset);
document.getElementById("clear-all-btn").addEventListener("click",confirmClearAll);
document.getElementById("retry-refresh-btn").addEventListener("click",retryRefresh);
document.getElementById("exit-btn").addEventListener("click",exitUI);
document.getElementById("search-input").addEventListener("input",function(e){applySearch(e.target.value)});
document.getElementById("search-input").addEventListener("keydown",function(e){
  if(e.key==="Escape"&&searchRaw){e.preventDefault();clearSearch()}
});
document.getElementById("search-clear-btn").addEventListener("click",clearSearch);
document.getElementById("expand-all-btn").addEventListener("click",function(){
  if(searchQuery)return;
  collapsedGroups={};
  renderGroups();
});
document.getElementById("collapse-all-btn").addEventListener("click",function(){
  if(searchQuery)return;
  config.groups.forEach(function(group){collapsedGroups[group.id]=true});
  renderGroups();
});
document.getElementById("group-select").addEventListener("change",function(e){
  if(e.target.value)navigateToGroup(e.target.value);
});
document.getElementById("modal-ov").addEventListener("click",function(e){
  if(e.target===this)hideModal();
});
document.getElementById("groups").addEventListener("input",function(e){
  var id=e.target&&e.target.id||"";
  if(id.indexOf("p-")===0&&e.target.type!=="password"){
    draftValues[id.slice(2)]=e.target.value;
    delete pendingRemovals[id.slice(2)];
  }
  if(id==="p-REMY_LLM_BASE_URL"||id==="p-REMY_LLM_MODEL")clearTestResult();
  updateDirtyState();
});
document.getElementById("groups").addEventListener("change",function(e){
  var id=e.target&&e.target.id||"";
  if(id.indexOf("p-")===0&&e.target.type!=="password"){
    draftValues[id.slice(2)]=e.target.value;
    delete pendingRemovals[id.slice(2)];
  }
  if(id==="p-REMY_LLM_BASE_URL"||id==="p-REMY_LLM_MODEL")clearTestResult();
  updateDirtyState();
});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();save("none")}
});
window.addEventListener("beforeunload",function(e){
  if(dirty){e.preventDefault();e.returnValue=""}
});
var heartbeatFailures=0;
var HEARTBEAT_FAILURE_LIMIT=3;
var serviceEnded=false;
function showServiceEnded(){
  if(serviceEnded)return;
  serviceEnded=true;
  var wasDirty=dirty;
  dirty=false;
  var ov=document.getElementById("modal-ov");
  var box=document.getElementById("modal-box");
  document.getElementById("modal-title").textContent="";
  document.getElementById("modal-msg").textContent="";
  document.getElementById("modal-btns").innerHTML="";
  box.querySelector("h2").textContent=wasDirty?t("serviceEndedDirty"):t("serviceEnded");
  box.querySelector("p").textContent="";
  ov.classList.add("show");
  ov.onclick=null;
}
function sendHeartbeat(){
  fetch("/api/heartbeat").then(function(r){
    if(r.ok){heartbeatFailures=0;return}
    heartbeatFailures+=1;
    if(heartbeatFailures>=HEARTBEAT_FAILURE_LIMIT)showServiceEnded();
  }).catch(function(){
    heartbeatFailures+=1;
    if(heartbeatFailures>=HEARTBEAT_FAILURE_LIMIT)showServiceEnded();
  });
}
setInterval(sendHeartbeat,2000);
init();
})();
</script>
