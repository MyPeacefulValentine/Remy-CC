<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remy Configuration</title>
<style>
:root{--c-pri:#6366f1;--c-pri-h:#4f46e5;--c-pri-a:#4338ca;--c-pri-ring:rgba(99,102,241,.1);--c-pri-shadow:rgba(99,102,241,.3);--c-bg:#f4f5f7;--c-srf:#fff;--c-bdr:#e5e7eb;--c-bdr-h:#d1d5db;--c-txt:#1a1a2e;--c-txt2:#374151;--c-txt3:#6b7280;--c-txt4:#9ca3af;--c-ok-bg:#ecfdf5;--c-ok-txt:#065f46;--c-ok-bdr:#a7f3d0;--c-err-bg:#fef2f2;--c-err-txt:#991b1b;--c-err-bdr:#fca5a5;--c-warn-bg:#fffbeb;--c-warn-txt:#92400e;--c-warn-bdr:#fde68a}
body.theme-project{--c-pri:#059669;--c-pri-h:#047857;--c-pri-a:#065f46;--c-pri-ring:rgba(5,150,105,.1);--c-pri-shadow:rgba(5,150,105,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--c-bg);color:var(--c-txt);line-height:1.6}
#app{max-width:820px;margin:0 auto;padding:32px 20px 100px}
header{margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-start}
.header-left{flex:1}
h1{font-size:22px;font-weight:700;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--c-txt3);word-break:break-all}
.header-actions{display:flex;gap:6px;margin-top:2px}
.btn-lang,.btn-mode-tag{padding:6px 14px;border:1px solid var(--c-bdr-h);border-radius:6px;background:var(--c-srf);cursor:pointer;font-size:13px;color:var(--c-txt2);white-space:nowrap;transition:all .15s}
.btn-lang:hover{background:#f3f4f6;transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btn-lang:active{transform:translateY(0);box-shadow:none}
.btn-mode-tag{cursor:default;font-weight:600;color:var(--c-pri);border-color:var(--c-pri)}
.group{background:var(--c-srf);border-radius:10px;margin-bottom:14px;border:1px solid var(--c-bdr);overflow:hidden}
.group-header{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;user-select:none;transition:background .15s}
.group-header:hover{background:#f9fafb}
.group-header .arrow{font-size:12px;color:var(--c-txt4);transition:transform .2s}
.group-header .arrow.collapsed{transform:rotate(-90deg)}
.group-header .badge{font-size:11px;font-weight:400;color:var(--c-txt3);margin-left:8px}
.group-header .gicon{margin-right:8px;font-size:16px}
.group-body{padding:4px 18px 18px;display:block}
.group-body.hidden{display:none}
.param{margin-bottom:16px;position:relative}
.param:last-child{margin-bottom:0}
.param-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.param-label{font-size:13px;font-weight:600;color:var(--c-txt2)}
.param-label code{font-family:"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:12.5px;background:#f3f4f6;padding:1px 5px;border-radius:3px}
.param-desc{font-size:12px;color:var(--c-txt3);margin-bottom:6px}
.param input,.param select{width:100%;padding:8px 10px;border:1px solid var(--c-bdr-h);border-radius:6px;font-size:14px;font-family:inherit;background:var(--c-srf);transition:border-color .15s,box-shadow .15s}
.param input:focus,.param select:focus{border-color:var(--c-pri);outline:none;box-shadow:0 0 0 3px var(--c-pri-ring)}
.param input:disabled,.param select:disabled{background:#f3f4f6;color:var(--c-txt4);cursor:not-allowed}
.param input[type=number]{appearance:textfield}
.param input[type=number]::-webkit-inner-spin-button{opacity:1}
.pw-wrap{display:flex;gap:6px}
.pw-wrap input{flex:1}
.btn-toggle{padding:8px 12px;border:1px solid var(--c-bdr-h);border-radius:6px;background:var(--c-srf);cursor:pointer;font-size:12px;white-space:nowrap;color:var(--c-txt2);transition:all .15s}
.btn-toggle:hover{background:#f3f4f6;transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btn-toggle:active{transform:translateY(0);box-shadow:none}
.toggle{position:relative;width:36px;height:20px;background:var(--c-bdr-h);border-radius:10px;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.active{background:var(--c-pri)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.active::after{transform:translateX(16px)}
.toggle-label{font-size:11px;color:var(--c-txt4);white-space:nowrap}
.footer{position:fixed;bottom:0;left:0;right:0;background:var(--c-srf);border-top:1px solid var(--c-bdr);padding:12px 24px;display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 -2px 8px rgba(0,0,0,.04);z-index:100}
.btn{padding:9px 22px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;border:1px solid var(--c-bdr-h);background:var(--c-srf);color:var(--c-txt2);transition:all .15s}
.btn:hover{background:#f3f4f6;transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn-p{background:var(--c-pri);color:#fff;border-color:var(--c-pri);box-shadow:0 2px 8px var(--c-pri-shadow)}
.btn-p:hover{background:var(--c-pri-h);transform:translateY(-1px);box-shadow:0 4px 12px var(--c-pri-shadow)}
.btn-p:active{background:var(--c-pri-a);transform:translateY(0);box-shadow:none}
.btn-w{color:#dc2626;border-color:#fca5a5}
.btn-w:hover{background:#fef2f2;transform:translateY(-1px);box-shadow:0 2px 6px rgba(220,38,38,.1)}
.status{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:13px;display:none;animation:fadeIn .2s}
.status.success{display:block;background:var(--c-ok-bg);color:var(--c-ok-txt);border:1px solid var(--c-ok-bdr)}
.status.error{display:block;background:var(--c-err-bg);color:var(--c-err-txt);border:1px solid var(--c-err-bdr)}
.unknown-warn{margin-top:12px;padding:10px 14px;background:var(--c-warn-bg);border:1px solid var(--c-warn-bdr);border-radius:8px;font-size:12px;color:var(--c-warn-txt)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-ov.show{opacity:1;pointer-events:auto}
.modal{background:var(--c-srf);border-radius:12px;padding:24px;width:360px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15);transform:scale(.95);transition:transform .2s}
.modal-ov.show .modal{transform:scale(1)}
.modal h2{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--c-txt)}
.modal p{font-size:13px;color:var(--c-txt3);margin-bottom:16px;line-height:1.5}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns .btn{padding:7px 16px;font-size:12px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
.toast-constraint{position:absolute;right:-8px;top:50%;transform:translateX(100%) translateY(-50%);background:var(--c-err-bg);color:var(--c-err-txt);border:1px solid var(--c-err-bdr);padding:4px 10px;border-radius:6px;font-size:11px;white-space:nowrap;z-index:50;animation:fadeIn .2s;pointer-events:none}
@keyframes fadeIn{from{opacity:0;transform:translateX(100%) translateY(-50%) translateX(4px)}to{opacity:1;transform:translateX(100%) translateY(-50%)}}
@media(max-width:600px){#app{padding:16px 12px 120px}.footer{flex-wrap:wrap;justify-content:center}header{flex-direction:column;gap:8px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <img src="/logo.svg" alt="Remy" width="32" height="32" style="vertical-align:middle;margin-right:8px" onerror="this.style.display='none'"><h1 id="title" style="display:inline;vertical-align:middle">Remy Configuration</h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="header-actions">
      <span class="btn-mode-tag" id="mode-tag"></span>
      <button class="btn-lang" id="lang-btn" onclick="toggleLang()">中文</button>
    </div>
  </header>
  <div id="groups"></div>
  <div id="unknown-area"></div>
  <div class="status" id="status"></div>
</div>
<div class="footer">
  <button class="btn btn-p" id="save-btn" title="">Save</button>
  <button class="btn" id="reset-btn" title="">Reset</button>
  <button class="btn btn-w" id="exit-btn" title="">Exit</button>
</div>
<div class="modal-ov" id="modal-ov">
  <div class="modal" id="modal-box">
    <h2 id="modal-title"></h2>
    <p id="modal-msg"></p>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>
<script>
(function(){
var config=null,lang="en",dirty=false,overrides={};

var ICONS={llm_api:"🧠",impact:"📊",injection:"📥",timeline:"📅",post_verify:"✅",security_audit:"🔒",debug:"🐛",test_gen:"🧪",ci:"🏗️",system:"⚙️",claude_code:"🤖"};

var TEXT={
  en:{title:"Remy Configuration",titleProject:"Remy Project Configuration",
      subtitle:"Editing: ~/.claude/settings.json",
      save:"✓ Save",reset:"↺ Reset to Defaults",exit:"✕ Exit",langBtn:"中文",
      modeGlobal:"Global",modeProject:"Project",
      saved:"Settings saved. Backup written to .bak.",
      resetDone:"Form reset to defaults (not yet saved).",
      error:"Error: ",
      unknownWarn:function(n,keys){return n+" unregistered env key(s) preserved on save: "+keys},
      show:"Show",hide:"Hide",
      inherit:"Inherit global",custom:"Custom",
      validationInt:" must be a number.",
      validationMin:" minimum value is ",validationMax:" maximum value is ",
      tipSave:"Save settings to disk (Ctrl+S)",
      tipReset:"Reset all parameters to default values",
      tipExit:"Close configuration UI",
      modalResetTitle:"Reset to Defaults",
      modalResetMsg:"This will reset all parameters to their default values. Unsaved changes will be lost.",
      modalResetConfirm:"Reset",modalResetCancel:"Cancel",
      modalExitTitle:"Unsaved Changes",
      modalExitMsg:"Current settings have unsaved changes. Save before exiting?",
      modalExitSave:"Save & Exit",modalExitDiscard:"Discard",modalExitCancel:"Cancel",
      closed:"Server closed. You may close this tab."},
  "zh-CN":{title:"Remy 配置",titleProject:"Remy 项目配置",
      subtitle:"编辑: ~/.claude/settings.json",
      save:"✓ 保存",reset:"↺ 恢复默认",exit:"✕ 退出",langBtn:"English",
      modeGlobal:"全局",modeProject:"项目",
      saved:"设置已保存。备份已写入 .bak。",
      resetDone:"表单已恢复默认值（尚未保存）。",
      error:"错误: ",
      unknownWarn:function(n,keys){return "发现 "+n+" 个未注册的 env 键（保存时保留）: "+keys},
      show:"显示",hide:"隐藏",
      inherit:"继承全局",custom:"自定义",
      validationInt:" 必须为数字。",
      validationMin:" 最小值为 ",validationMax:" 最大值为 ",
      tipSave:"保存设置到磁盘 (Ctrl+S)",
      tipReset:"将所有参数重置为默认值",
      tipExit:"关闭配置界面",
      modalResetTitle:"恢复默认值",
      modalResetMsg:"所有参数将恢复为默认值。未保存的修改将丢失。",
      modalResetConfirm:"恢复",modalResetCancel:"取消",
      modalExitTitle:"未保存的修改",
      modalExitMsg:"当前设置已修改但未保存。是否先保存再退出？",
      modalExitSave:"保存并退出",modalExitDiscard:"放弃修改",modalExitCancel:"取消",
      closed:"服务已关闭，可关闭此标签页。"}
};

function t(key){return(TEXT[lang]||TEXT.en)[key]||(TEXT.en)[key]||key}
function isProject(){return config&&config.mode==="project"}

window.toggleLang=function(){
  lang=(lang==="en")?"zh-CN":"en";
  render();
};

function init(){
  fetch("/api/config").then(function(r){return r.json()}).then(function(data){
    config=data;
    lang=config.lang==="zh-CN"?"zh-CN":"en";
    if(isProject()){
      document.body.classList.add("theme-project");
      overrides={};
      var locals=config.env_local||{};
      for(var k in locals){overrides[k]=true}
    }
    render();
  }).catch(function(e){
    document.getElementById("status").className="status error";
    document.getElementById("status").textContent="Failed to load: "+e.message;
    document.getElementById("status").style.display="block";
  });
}

function render(){
  var proj=isProject();
  document.title=proj?t("titleProject"):t("title");
  document.getElementById("title").textContent=document.title;
  document.getElementById("save-btn").textContent=t("save");
  document.getElementById("reset-btn").textContent=t("reset");
  document.getElementById("exit-btn").textContent=t("exit");
  document.getElementById("lang-btn").textContent=t("langBtn");
  document.getElementById("mode-tag").textContent=proj?t("modeProject"):t("modeGlobal");
  document.getElementById("save-btn").title=t("tipSave");
  document.getElementById("reset-btn").title=t("tipReset");
  document.getElementById("exit-btn").title=t("tipExit");

  if(proj){
    document.getElementById("subtitle").textContent=config.target||"";
  }else{
    document.getElementById("subtitle").textContent=t("subtitle");
  }

  var container=document.getElementById("groups");
  container.innerHTML="";

  config.groups.forEach(function(group){
    var params=config.registry.filter(function(p){return p.group===group.id});
    if(!params.length)return;
    var section=document.createElement("div");
    section.className="group";
    var header=document.createElement("div");
    header.className="group-header";
    var label=lang==="zh-CN"?group.label_zh:group.label_en;
    var icon=ICONS[group.id]||"📋";
    header.innerHTML='<span><span class="gicon">'+icon+'</span>'+label+'<span class="badge">'+params.length+'</span></span><span class="arrow">▾</span>';
    var body=document.createElement("div");
    body.className="group-body";
    header.addEventListener("click",function(){
      var arrow=header.querySelector(".arrow");
      if(body.classList.contains("hidden")){body.classList.remove("hidden");arrow.classList.remove("collapsed")}
      else{body.classList.add("hidden");arrow.classList.add("collapsed")}
    });
    params.forEach(function(param){body.appendChild(createParam(param))});
    section.appendChild(header);
    section.appendChild(body);
    container.appendChild(section);
  });

  var unknownArea=document.getElementById("unknown-area");
  unknownArea.innerHTML="";
  if(!proj&&config.unknown_keys&&config.unknown_keys.length>0){
    var warn=document.createElement("div");
    warn.className="unknown-warn";
    var fn=t("unknownWarn");
    warn.textContent=typeof fn==="function"?fn(config.unknown_keys.length,config.unknown_keys.join(", ")):fn;
    unknownArea.appendChild(warn);
  }
}

function getCurrentValue(param){
  if(isProject()){
    var local=config.env_local||{};
    if(param.key in local)return local[param.key];
    var global_env=config.env_global||{};
    if(param.key in global_env)return global_env[param.key];
    return param["default"];
  }
  var env=config.env||{};
  return env[param.key]!=null?env[param.key]:param["default"];
}

function getGlobalValue(param){
  var g=config.env_global||{};
  return g[param.key]!=null?g[param.key]:param["default"];
}

function optionLabel(param,idx,optValue){
  var descs=lang==="zh-CN"?param.option_desc_zh:param.option_desc_en;
  if(descs&&descs[idx])return optValue+" — "+descs[idx];
  return optValue;
}

function createParam(param){
  var div=document.createElement("div");
  div.className="param";
  var proj=isProject();
  var isOverride=proj&&overrides[param.key];
  var currentValue=getCurrentValue(param);
  var globalValue=proj?getGlobalValue(param):null;

  var top=document.createElement("div");
  top.className="param-top";
  var lbl=document.createElement("span");
  lbl.className="param-label";
  lbl.innerHTML="<code>"+param.key+"</code>";
  top.appendChild(lbl);

  var toggleEl=null;
  if(proj){
    toggleEl=document.createElement("div");
    toggleEl.className="toggle"+(isOverride?" active":"");
    toggleEl.title=isOverride?t("custom"):t("inherit");
    top.appendChild(toggleEl);
    var tLbl=document.createElement("span");
    tLbl.className="toggle-label";
    tLbl.textContent=isOverride?t("custom"):t("inherit");
    top.appendChild(tLbl);
  }

  var desc=document.createElement("div");
  desc.className="param-desc";
  desc.textContent=lang==="zh-CN"?param.desc_zh:param.desc_en;

  var displayValue=isOverride?currentValue:(proj?globalValue:currentValue);
  var disabled=proj&&!isOverride;
  var input;

  if(param.type==="enum"){
    input=document.createElement("select");
    input.id="p-"+param.key;
    input.disabled=disabled;
    (param.options||[]).forEach(function(opt,idx){
      var o=document.createElement("option");
      o.value=opt;
      o.textContent=optionLabel(param,idx,opt);
      if(opt===displayValue)o.selected=true;
      input.appendChild(o);
    });
    div.appendChild(top);
    div.appendChild(desc);
    div.appendChild(input);
  }else if(param.type==="password"){
    input=document.createElement("input");
    input.type="password";input.id="p-"+param.key;
    input.value=displayValue;input.autocomplete="off";
    input.disabled=disabled;
    var toggleBtn=document.createElement("button");
    toggleBtn.type="button";toggleBtn.className="btn-toggle";
    toggleBtn.textContent=t("show");
    toggleBtn.addEventListener("click",function(){
      if(input.type==="password"){input.type="text";toggleBtn.textContent=t("hide")}
      else{input.type="password";toggleBtn.textContent=t("show")}
    });
    var wrap=document.createElement("div");
    wrap.className="pw-wrap";
    wrap.appendChild(input);
    wrap.appendChild(toggleBtn);
    div.appendChild(top);
    div.appendChild(desc);
    div.appendChild(wrap);
  }else if(param.type==="int"){
    input=document.createElement("input");
    input.type="number";input.id="p-"+param.key;
    input.value=displayValue;input.disabled=disabled;
    if(param.min!=null)input.min=param.min;
    if(param.max!=null)input.max=param.max;
    div.appendChild(top);
    div.appendChild(desc);
    div.appendChild(input);
  }else{
    input=document.createElement("input");
    input.type=param.type==="url"?"url":"text";
    input.id="p-"+param.key;
    input.value=displayValue;input.disabled=disabled;
    div.appendChild(top);
    div.appendChild(desc);
    div.appendChild(input);
  }

  if(proj&&toggleEl){
    (function(paramKey,inputEl,tEl,tLabel){
      tEl.addEventListener("click",function(){
        var active=tEl.classList.toggle("active");
        overrides[paramKey]=active;
        inputEl.disabled=!active;
        tLabel.textContent=active?t("custom"):t("inherit");
        tEl.title=tLabel.textContent;
        if(!active){
          inputEl.value=getGlobalValue({key:paramKey,"default":""});
        }
        dirty=true;
      });
    })(param.key,input,toggleEl,top.querySelector(".toggle-label"));
  }

  return div;
}

function collectFormData(){
  var data={};
  config.registry.forEach(function(param){
    var el=document.getElementById("p-"+param.key);
    if(el)data[param.key]=el.value;
  });
  return data;
}

function validate(data){
  var keysToCheck=isProject()?overrides:null;
  for(var i=0;i<config.registry.length;i++){
    var param=config.registry[i];
    if(param.type!=="int")continue;
    if(keysToCheck&&!keysToCheck[param.key])continue;
    var val=data[param.key];
    var num=parseInt(val,10);
    if(isNaN(num))return param.key+t("validationInt");
    if(param.min!=null&&num<param.min)return param.key+t("validationMin")+param.min;
    if(param.max!=null&&num>param.max)return param.key+t("validationMax")+param.max;
  }
  return null;
}

function validateConstraints(data){
  var fullMax=parseInt(data["LOGIC_DENSITY_FULL_MAX"]||"200",10);
  var compactMax=parseInt(data["LOGIC_DENSITY_COMPACT_MAX"]||"500",10);
  var coreMax=parseInt(data["LOGIC_DENSITY_CORE_MAX"]||"2000",10);
  var eCap=parseInt(data["ENRICHMENT_CAP"]||"15",10);
  var eCapLarge=parseInt(data["ENRICHMENT_CAP_LARGE"]||"10",10);
  var eTierFull=parseInt(data["ENRICHMENT_TIER_FULL_MAX"]||"200",10);
  var eTierMid=parseInt(data["ENRICHMENT_TIER_MID_MAX"]||"1000",10);
  var errors=[];
  if(fullMax>compactMax)errors.push({key:"LOGIC_DENSITY_FULL_MAX",msg:"must be ≤ COMPACT_MAX"});
  if(compactMax>coreMax)errors.push({key:"LOGIC_DENSITY_COMPACT_MAX",msg:"must be ≤ CORE_MAX"});
  if(eCap<eCapLarge)errors.push({key:"ENRICHMENT_CAP",msg:"must be ≥ CAP_LARGE"});
  if(eTierFull>eTierMid)errors.push({key:"ENRICHMENT_TIER_FULL_MAX",msg:"must be ≤ TIER_MID_MAX"});
  return errors.length?errors:null;
}

function clearToasts(){
  var old=document.querySelectorAll(".toast-constraint");
  for(var i=0;i<old.length;i++)old[i].parentNode.removeChild(old[i]);
}

function showToast(key,msg){
  var input=document.getElementById("p-"+key);
  if(!input)return;
  var container=input.closest(".param");
  if(!container)return;
  var el=document.createElement("span");
  el.className="toast-constraint";
  el.textContent=msg;
  container.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},3000);
}

function save(){
  var data=collectFormData();
  clearToasts();
  var err=validate(data);
  if(err){showStatus("error",err);return}
  var constraintErrors=validateConstraints(data);
  if(constraintErrors){
    for(var i=0;i<constraintErrors.length;i++)showToast(constraintErrors[i].key,constraintErrors[i].msg);
    return;
  }

  var body;
  if(isProject()){
    var overrideList=[];
    for(var k in overrides){if(overrides[k])overrideList.push(k)}
    body=JSON.stringify({env:data,overrides:overrideList});
  }else{
    body=JSON.stringify({env:data});
  }

  fetch("/api/save",{method:"POST",
    headers:{"Content-Type":"application/json"},body:body
  }).then(function(r){return r.json()}).then(function(result){
    if(result.status==="ok"){dirty=false;showStatus("success",t("saved"))}
    else{showStatus("error",t("error")+(result.message||""))}
  }).catch(function(e){showStatus("error",t("error")+e.message)});
}

function confirmReset(){
  showModal(t("modalResetTitle"),t("modalResetMsg"),[
    {text:t("modalResetCancel"),cls:"btn",action:hideModal},
    {text:t("modalResetConfirm"),cls:"btn btn-w",action:function(){hideModal();doReset()}}
  ]);
}

function doReset(){
  if(isProject()){
    overrides={};
    config.registry.forEach(function(param){
      var el=document.getElementById("p-"+param.key);
      if(el){el.value=getGlobalValue(param);el.disabled=true}
    });
    render();
  }else{
    config.registry.forEach(function(param){
      var el=document.getElementById("p-"+param.key);
      if(el)el.value=param["default"];
    });
  }
  dirty=true;
  showStatus("success",t("resetDone"));
}

function exitUI(){
  if(dirty){
    showModal(t("modalExitTitle"),t("modalExitMsg"),[
      {text:t("modalExitCancel"),cls:"btn",action:hideModal},
      {text:t("modalExitDiscard"),cls:"btn btn-w",action:function(){hideModal();doShutdown()}},
      {text:t("modalExitSave"),cls:"btn btn-p",action:function(){hideModal();save();setTimeout(doShutdown,300)}}
    ]);
  }else{
    doShutdown();
  }
}

function doShutdown(){
  fetch("/api/shutdown",{method:"POST"}).catch(function(){});
  dirty=false;
  var ov=document.getElementById("modal-ov");
  var box=document.getElementById("modal-box");
  document.getElementById("modal-title").textContent="";
  document.getElementById("modal-msg").textContent="";
  document.getElementById("modal-btns").innerHTML="";
  box.querySelector("h2").textContent=t("closed");
  box.querySelector("p").textContent="";
  var btns=document.getElementById("modal-btns");
  var okBtn=document.createElement("button");
  okBtn.className="btn";
  okBtn.textContent="OK";
  okBtn.addEventListener("click",function(){window.close()});
  btns.appendChild(okBtn);
  ov.classList.add("show");
  ov.onclick=null;
}

function showModal(title,msg,buttons){
  document.getElementById("modal-title").textContent=title;
  document.getElementById("modal-msg").textContent=msg;
  var btnsEl=document.getElementById("modal-btns");
  btnsEl.innerHTML="";
  buttons.forEach(function(b){
    var btn=document.createElement("button");
    btn.className=b.cls;
    btn.textContent=b.text;
    btn.addEventListener("click",b.action);
    btnsEl.appendChild(btn);
  });
  document.getElementById("modal-ov").classList.add("show");
}

function hideModal(){
  document.getElementById("modal-ov").classList.remove("show");
}

function showStatus(type,msg){
  var el=document.getElementById("status");
  el.className="status "+type;
  el.textContent=msg;
  el.style.display="block";
  clearTimeout(el._timer);
  el._timer=setTimeout(function(){el.style.display="none"},6000);
}

document.getElementById("save-btn").addEventListener("click",save);
document.getElementById("reset-btn").addEventListener("click",confirmReset);
document.getElementById("exit-btn").addEventListener("click",exitUI);
document.getElementById("modal-ov").addEventListener("click",function(e){
  if(e.target===this)hideModal();
});
document.getElementById("groups").addEventListener("input",function(){dirty=true});
document.getElementById("groups").addEventListener("change",function(){dirty=true});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();save()}
});
window.addEventListener("beforeunload",function(e){
  if(dirty){e.preventDefault();e.returnValue=""}
});
init();
})();
</script>
</body>
</html>
