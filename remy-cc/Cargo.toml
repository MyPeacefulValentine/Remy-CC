[workspace]
members = [".", "scanner-core"]

[package]
name = "remy-cc"
version = "2.0.1"
edition = "2021"
description = "Remy-CC resident daemon (R1.1: single-instance skeleton)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions"] }
scanner-core = { path = "scanner-core" }
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
sha2 = "0.10"
md-5 = "0.10"
tar = "0.4"
flate2 = "1"

[build-dependencies]
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
